[package]
name = "aletheia-excel"
version = "5.0.0"
edition = "2021"
description = "Aletheia Excel check/DBC loader — a separate crate so the .xlsx dependency chain (calamine + rust_xlsxwriter) is optional for core users."
license = "BSD-2-Clause"
repository = "https://github.com/Jaetan/aletheia"
publish = false

[dependencies]
aletheia = { path = ".." }
calamine = "0.35.0"
rust_xlsxwriter = "0.95.0"
zip = "8.6.0"

[dev-dependencies]
# Reads the cross-binding loader contract, docs/LOADER_SCENARIOS.yaml, in
# tests/loader_scenarios.rs.
yaml-rust2 = "0.10"

[lib]
name = "aletheia_excel"
path = "src/lib.rs"
