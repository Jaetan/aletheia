#
# The mutation lane's configuration, read by cargo-mutants from the crate it
# examines, so every sweep makes one set.
#
# The files are the hot path the Rust coding standard names: the response
# decoder, the DBC model, the domain types and the FFI backend.  Every
# feature is on, as the suite is run everywhere else, so the async client's
# tests are among the ones a mutant has to get past.
#
# tools/mutation_rust.py sweeps a scratch copy of the whole tree and passes
# `--in-place` within it: the suite includes the DBC corpus and the parity
# snapshots under python/ at compile time, and the documents under docs/ at
# run time, so the copy of the crate alone that cargo-mutants would make does
# not build.  In place, one mutant runs at a time.
examine_globs = ["src/response.rs", "src/dbc.rs", "src/types.rs", "src/backend.rs"]
all_features = true
# A function returning Result gets an Err mutant only from a value named here:
# without one, cargo-mutants can offer it only Ok of a default, and a Result
# whose error type has no default yields nothing viable at all.  Any variant
# serves, a test that expects Ok failing on every one of them; Protocol is the
# one the decoders themselves raise, so a test asserting on the message text
# still tells the mutant from the code's own refusal.
error_values = ["crate::Error::Protocol(String::new())"]
# The doc-example harness builds and runs every Rust fence of the documents as
# a program of its own.  It holds the documents to the crate, and a sweep with
# it and one without gave the same verdict on every mutant, so the sweep runs
# every test but that one.  cargo-mutants appends these to `cargo test`
# without reading the separator, and the runner passes no test argument of
# its own, so this `--` is the one that hands `--skip` to the test binaries.
additional_cargo_test_args = ["--", "--skip", "every_rust_fence_of_the_listed_documents_builds_and_runs"]
