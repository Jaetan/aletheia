# SPDX-License-Identifier: BSD-2-Clause
#
# The cross-language benchmark on a GitHub-hosted runner (ubuntu-24.04,
# 4-core / ~16 GB), with the supported toolchain pinned to the versions the
# committed instruction counts rest on (clang-23, Python 3.14.10, Go 1.27.4,
# Rust 1.98.1), in two legs on every pull request: throughput, which prints
# each lane's frames per second and holds each lane's instructions per
# operation, counted under valgrind, to the counts committed in
# benchmarks/instruction_counts.json and to the budgets for its bus in
# benchmarks/instruction_budgets.json, and `load scaling`, which fails when the
# bytes a binding's DBC load allocates outgrow the doublings of its messages or
# of one number's digits and is a check the main branch ruleset requires.  Both
# gates read counts, so a run's verdict does not rest on the runner's speed.
# A manual run measures the one mode it is given.  Results are printed to the
# log and uploaded as an artifact.
# The toolchain setup mirrors pr-full-ci.yml and reuses its cache keys so the
# Agda build and the clang-23 debs are warm if that workflow has run.

name: Benchmark

on:
  # On every PR, with no path filter: `load scaling` is required, and a
  # workflow a filter skips reports nothing, which leaves a required check
  # pending.  Each leg asks instead whether the diff can move a measurement
  # (tools/benchmark_scope.py) and installs and measures only if it can, so a
  # documentation-only change costs the scope question and nothing more.
  pull_request:
  # Manual: ad-hoc numbers with custom parameters (the gate is PR-only, so
  # exploratory dispatch runs are never gated).
  workflow_dispatch:
    inputs:
      frames:
        description: 'Frames per run'
        required: false
        default: '5000'
      runs:
        description: 'Repetitions (median reported)'
        required: false
        default: '5'
      bench:
        description: 'Benchmark suite'
        required: false
        default: 'throughput'
        type: choice
        options:
          - throughput
          - latency
          - scaling

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

# Every `run:` step runs under the watchdog (tools/watch_step.py): `bash -e` as
# GitHub's own default shell runs it, its output in the job log as it comes, its
# progress held by the step's declaration in tools/_workflow_steps.py.
defaults:
  run:
    shell: python3.14 -m tools.watch_step {0}

jobs:
  benchmark:
    # One leg per mode: throughput and scaling on a pull request, the chosen
    # mode on a manual run.  Each leg reports its own check, so `load scaling`
    # can be required while throughput stays advisory, and a failed leg does
    # not cancel the other.
    name: ${{ matrix.bench == 'scaling' && 'load scaling' || format('cross-language {0} (ubuntu-24.04)', matrix.bench) }}
    strategy:
      fail-fast: false
      matrix:
        bench: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', github.event.inputs.bench) || '["throughput", "scaling"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GHC_VERSION: '9.12.2'
      AGDA_VERSION: '2.9.0'
      STDLIB_VERSION: 'v2.4.1'
      RUST_VERSION: '1.98.1'
      # Defaults apply on pull_request (no inputs); the PR gate is consistent
      # because every PR run uses these same values, matching the baseline.
      FRAMES: ${{ github.event.inputs.frames || '5000' }}
      RUNS: ${{ github.event.inputs.runs || '5' }}
      BENCH: ${{ matrix.bench }}
    steps:
      - name: Checkout (full history, for the diff the scope reads)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Exact versions: an instruction count rests on the interpreter's build,
      # and the committed counts record the toolchain they were taken with.
      - name: Set up Python 3.14.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
          # Cache pip's wheel-download cache, keyed on the dependency manifest,
          # so `pip install -e python/.[dev]` reuses downloaded wheels across
          # runs (the venv itself is re-created each run; this saves the fetch).
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Ensure a local `main` ref for `git diff main...HEAD`
        run: git fetch --no-tags origin +refs/heads/main:refs/heads/main || true

      - name: Create the dev venv (python/.venv) with aletheia installed
        run: |
          set -euo pipefail
          python3.14 -m venv python/.venv
          python/.venv/bin/pip install --upgrade pip
          python/.venv/bin/pip install -e 'python/.[dev]'

      # Whether this diff can move a measurement: the same reading of the diff
      # the mutation lanes scope by (tools/benchmark_scope.py says which paths
      # count).  Every later step that installs, builds or measures reads
      # LANE_MEASURES as `!= '0'`, so an answer that did not arrive measures.
      # The job itself always runs, so `load scaling`, a required check, is
      # reported on every pull request, measured or not.
      - name: Does this diff move a measurement?
        run: python/.venv/bin/python3 -m tools.benchmark_scope

      - name: Nothing to measure on this diff
        if: env.LANE_MEASURES == '0'
        run: echo "This diff moves no binding, the kernel or the benchmark harness, so nothing was measured or gated."

      - name: Set up GHC + cabal
        if: env.LANE_MEASURES != '0'
        run: |
          set -euo pipefail
          echo "CABAL_DIR=${HOME}/.cabal" >> "${GITHUB_ENV}"
          export CABAL_DIR="${HOME}/.cabal"
          sudo chown -R "$(id -un):$(id -gn)" /usr/local/.ghcup 2>/dev/null || true
          ghcup install cabal 3.16.1.0 --set
          ghc_dir="$(ghcup whereis basedir)/ghc/${GHC_VERSION}"
          echo "GHC_DIR=${ghc_dir}" >> "${GITHUB_ENV}"
          {
            echo "${HOME}/.cabal/bin"
            echo "${HOME}/.ghcup/bin"
            echo "${ghc_dir}/bin"
          } >> "${GITHUB_PATH}"

      # GHC cached in the directory ghcup installs it to (pr-full-ci.yml says why).
      - name: Restore GHC ${{ env.GHC_VERSION }}
        if: env.LANE_MEASURES != '0'
        id: ghc-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GHC_DIR }}
          key: ghc${{ env.GHC_VERSION }}-noble-v2

      - name: Install GHC ${{ env.GHC_VERSION }} (only on a cache miss)
        if: env.LANE_MEASURES != '0' && steps.ghc-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ghcup install ghc "${GHC_VERSION}" --set
          installed="$(ghcup whereis --directory ghc "${GHC_VERSION}")"
          [ "${installed}" = "${GHC_DIR}/bin" ] || {
            echo "::error::ghcup installed GHC at ${installed}, not under ${GHC_DIR}, which the cache holds"
            exit 1
          }

      - name: Save GHC (only on a cache miss)
        if: env.LANE_MEASURES != '0' && steps.ghc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.GHC_DIR }}
          key: ghc${{ env.GHC_VERSION }}-noble-v2

      # Reuses pr-full-ci.yml's cabal cache key so the (15-20 min) Agda build is
      # warm whenever that workflow has populated it.
      - name: Restore cabal store (Agda library + executable + deps)
        if: env.LANE_MEASURES != '0'
        id: cabal-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            ~/.cabal/bin
          key: cabal-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-agda${{ env.AGDA_VERSION }}-${{ hashFiles('shake.cabal') }}-v3
          restore-keys: |
            cabal-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-agda${{ env.AGDA_VERSION }}-

      # The index is refreshed only where no store was restored (pr-full-ci.yml
      # says why).
      - name: Update cabal package index (only on a cabal-store cache miss)
        if: env.LANE_MEASURES != '0' && steps.cabal-cache.outputs.cache-matched-key == ''
        run: cabal update

      - name: Install Agda ${{ env.AGDA_VERSION }} (binary + store library)
        if: env.LANE_MEASURES != '0'
        run: cabal install "Agda-${AGDA_VERSION}" --overwrite-policy=always

      # The shake executable's dependencies join the store (pr-full-ci.yml says why).
      - name: Build the shake executable's dependencies into the store
        if: env.LANE_MEASURES != '0'
        run: cabal build --only-dependencies aletheia-build:exe:shake

      - name: Save cabal store (only on a cache miss)
        if: env.LANE_MEASURES != '0' && steps.cabal-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            ~/.cabal/bin
          key: cabal-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-agda${{ env.AGDA_VERSION }}-${{ hashFiles('shake.cabal') }}-v3

      - name: Cache agda-stdlib ${{ env.STDLIB_VERSION }}
        if: env.LANE_MEASURES != '0'
        uses: actions/cache@v6
        with:
          path: ~/.agda/agda-stdlib
          key: agda-stdlib-${{ env.STDLIB_VERSION }}

      - name: Install + register agda-stdlib ${{ env.STDLIB_VERSION }}
        if: env.LANE_MEASURES != '0'
        run: |
          set -euo pipefail
          mkdir -p ~/.agda
          if [ ! -d ~/.agda/agda-stdlib/.git ]; then
            git clone --depth 1 --branch "${STDLIB_VERSION}" \
              https://github.com/agda/agda-stdlib.git ~/.agda/agda-stdlib
          fi
          echo "${HOME}/.agda/agda-stdlib/standard-library.agda-lib" > ~/.agda/libraries
          echo "standard-library" > ~/.agda/defaults

      - name: Set up Go 1.27.4
        if: env.LANE_MEASURES != '0'
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: |
            go/go.sum
            go/excel/go.sum

      - name: Set up Rust ${{ env.RUST_VERSION }}
        if: env.LANE_MEASURES != '0'
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_VERSION}" --profile minimal --no-self-update
          rustup default "${RUST_VERSION}"

      # ubuntu-24.04 pre-installs only clang ≤19; install clang-23 (the supported
      # toolchain) from apt.llvm.org.  Reuses pr-full-ci.yml's deb-cache key.
      - name: Cache clang-23 .debs (Clang is a large download)
        if: env.LANE_MEASURES != '0'
        uses: actions/cache@v6
        with:
          path: ~/llvm-cache
          key: clang23-libstdcxx15-noble-v2
      - name: Install C++ toolchain (clang-23 from apt.llvm.org)
        if: env.LANE_MEASURES != '0'
        run: cpp/toolchain/install.sh ~/llvm-cache clang-23 clang-tidy-23 libstdc++-15-dev

      # Restore the incremental build tree (Agda .agdai + MAlonzo .hs + the cabal
      # foreign-lib build under haskell-shim/dist-newstyle) so `cabal run shake
      # -- build` rebuilds ONLY what this commit changed instead of the whole
      # tree (cold ~342s -> ~23s).  haskell-shim/dist-newstyle (the ~194 MB
      # .o/.hi tree) is essential: it is the cabal foreign-lib build state that
      # build/libaletheia-ffi.so is copied out of (shake/Rules/Library.hs `cp`), so
      # omitting it forced cabal to recompile all 276 MAlonzo objects (~47s) on
      # EVERY run.  Restore-ONLY: pr-full-ci.yml
      # (and its push:main runs) seed and own this cache, and the shared
      # restore-keys prefix means a brand-new PR warms from main's tree on its
      # very first push.  Not saving here avoids a large double-upload and a
      # concurrent-save race with pr-full-ci (cancel-in-progress is on).  Safe to
      # share the key: Shake (ChangeModtimeAndDigest) and GHC (mi_src_hash) key
      # on CONTENT, not mtime, which actions/cache resets — so `shake -- build`
      # reproduces the exact current .so and the benchmark measures the PR's
      # actual code.
      - name: Restore incremental build tree (build/ + _build/ + dist-newstyle/)
        if: env.LANE_MEASURES != '0'
        uses: actions/cache/restore@v6
        with:
          path: |
            build
            _build
            dist-newstyle
            haskell-shim/dist-newstyle
          key: build-tree-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-agda${{ env.AGDA_VERSION }}-stdlib${{ env.STDLIB_VERSION }}-${{ github.sha }}
          restore-keys: |
            build-tree-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-agda${{ env.AGDA_VERSION }}-stdlib${{ env.STDLIB_VERSION }}-

      - name: Build the FFI library (libaletheia-ffi.so)
        if: env.LANE_MEASURES != '0'
        run: cabal run shake -- build

      # ── C++ build caching (ccache + CMake FetchContent deps) ────────────────
      # Both must be in place BEFORE the cmake CONFIGURE below: cpp/CMakeLists.txt
      # bakes the ccache launcher (CMAKE_CXX_COMPILER_LAUNCHER) at find_program =
      # configure time, and FetchContent downloads its deps during configure.
      - name: Set up ccache
        if: env.LANE_MEASURES != '0'
        run: |
          set -euo pipefail
          command -v ccache >/dev/null || { sudo apt-get update && sudo apt-get install -y ccache; }
          {
            echo "CCACHE_DIR=${HOME}/.ccache"
            echo "CCACHE_MAXSIZE=2G"
          } >> "${GITHUB_ENV}"

      # Distinct key from pr-full-ci.yml's ccache: this lane compiles only the
      # Release `benchmark` target, whereas pr-full-ci accumulates Debug + UBSan
      # objects.  A shared key would let a Release-only save win the
      # immutable-key race and cold-start pr-full-ci's ctest/ubsan lanes.
      # Separate pools (split restore/save, like the build tree).
      - name: Restore ccache (benchmark lane)
        if: env.LANE_MEASURES != '0'
        id: ccache-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-bench-${{ runner.os }}-clang23-${{ github.sha }}
          restore-keys: |
            ccache-bench-${{ runner.os }}-clang23-

      # Caches the Release build's FetchContent deps (json / yaml-cpp / OpenXLSX
      # / Catch2) so configure does not re-download each tarball every run.
      # Distinct key from pr-full-ci.yml's `cpp-deps-*` (which caches every tree
      # run_ci configures); a shared key would clobber that cache with this
      # lane's single cpp/build/_deps.  Split restore/save (like ccache + the cabal
      # store): the combined action saves only on overall job SUCCESS, so a
      # failed benchmark/regression-gate iteration would drop the deps and force
      # a re-download next run (and re-expose the transient OpenXLSX 504 the
      # FetchContent fetch has hit before).  The save below persists them even
      # on a red later step.
      - name: Restore C++ FetchContent deps (benchmark lane)
        if: env.LANE_MEASURES != '0'
        id: cpp-deps-cache
        uses: actions/cache/restore@v6
        with:
          path: cpp/build/_deps
          key: cpp-deps-bench-${{ runner.os }}-${{ hashFiles('cpp/CMakeLists.txt') }}

      - name: Build the C++ benchmark (Release, clang-23)
        if: env.LANE_MEASURES != '0'
        run: |
          set -euo pipefail
          # -S cpp: CMakeLists.txt lives in cpp/, not the repo root.
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23
          cmake --build cpp/build --target benchmark

      - name: Build the Go benchmark
        if: env.LANE_MEASURES != '0'
        run: |
          set -euo pipefail
          cd go && go build -o benchmarks/benchmark ./benchmarks/

      - name: Select the arguments the chosen mode reads
        if: env.LANE_MEASURES != '0'
        id: ready
        run: |
          set -euo pipefail
          # run_all.sh refuses a flag the selected mode does not read, rather
          # than accepting it and measuring its default: throughput reads both
          # counts, latency reads the frame count as its operation count, and
          # scaling picks its own sweep sizes and reads the run count, plus the
          # quick sweeps on a pull request, which are what its gate judges. The
          # dispatch inputs are numbers and mode names, so the string splits
          # back into arguments safely where it is used.
          case "${BENCH}" in
            throughput) args="--frames ${FRAMES} --runs ${RUNS}" ;;
            latency)    args="--frames ${FRAMES}" ;;
            scaling)    args="--runs ${RUNS}"
                        if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then args="${args} --quick"; fi ;;
            *) echo "unknown bench '${BENCH}'" >&2; exit 1 ;;
          esac
          echo "BENCH_ARGS=${args}" >> "${GITHUB_ENV}"

      # The job's setup ends at `ready`: each check below waits on it having
      # passed rather than on every step before it, so one failing check stops
      # no other (python/tests/test_workflow_check_steps.py).
      # Full-teeth cross-binding schema check: all four binaries are built here
      # (C++/Go above, Rust below, Python via the venv), so this asserts the
      # "same measurement, same name" contract (benchmarks/SCHEMA.yaml) across
      # every binding — the run_ci copy only reaches the Python reference.  The
      # measurement after it builds its own Rust binary and reads nothing this
      # step writes, so a schema failure stops no measurement.
      - name: Cross-binding benchmark-schema conformance
        if: ${{ env.LANE_MEASURES != '0' && !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo build --release --example benchmark --manifest-path rust/Cargo.toml
          source python/.venv/bin/activate
          # --built: all four binaries are freshly built in this job, so require +
          # check every binding (full teeth). run_ci uses the default python-only
          # mode, which never runs a possibly-stale on-disk compiled binary.
          python3 -m tools.check_bench_schema --built

      - name: Run the cross-language benchmark
        if: ${{ env.LANE_MEASURES != '0' && !cancelled() && steps.ready.outcome == 'success' }}
        id: measure
        run: |
          set -euo pipefail
          # Activate the venv so run_all.sh's `python3 -m benchmarks.<bench>`
          # resolves to the venv interpreter (which has aletheia installed).
          source python/.venv/bin/activate
          read -ra args <<< "${BENCH_ARGS}"
          bash benchmarks/run_all.sh "${args[@]}" --bench "${BENCH}"

      # The throughput leg's gate reads counts, not times: each lane of each
      # binding runs alone under valgrind's cachegrind at two frame counts, and
      # the difference over the frames is its instructions per operation
      # (tools/benchmark_instructions.py).
      - name: Install valgrind (throughput)
        if: ${{ env.LANE_MEASURES != '0' && matrix.bench == 'throughput' && !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Count each lane's instructions (throughput)
        if: ${{ env.LANE_MEASURES != '0' && matrix.bench == 'throughput' && !cancelled() && steps.measure.outcome == 'success' }}
        id: count
        run: python/.venv/bin/python3 -m tools.benchmark_instructions

      # PR gate.  Throughput: fail when a lane's instructions per operation
      # moved more than 5% from benchmarks/instruction_counts.json either way,
      # or are over its budget in benchmarks/instruction_budgets.json, or the
      # counts or the budgets rest on another toolchain.  Scaling: fail when the bytes
      # a binding's DBC load allocates outgrow the doublings of its messages or
      # of one number's digits.  tools/benchmark_gate.py says by how much.
      # Both read counts a re-run repeats to well within those bounds (an
      # instruction count to within 1.76% across runner classes), so a failed
      # gate is a verdict and nothing re-runs.  PR-only: exploratory
      # workflow_dispatch runs are not gated.  It reads what the measurement
      # and the count write, so it waits on them.
      - name: Regression gate
        if: ${{ env.LANE_MEASURES != '0' && github.event_name == 'pull_request' && !cancelled() && steps.measure.outcome == 'success' && (matrix.bench != 'throughput' || steps.count.outcome == 'success') }}
        run: |
          set -euo pipefail
          if [ "${BENCH}" = throughput ]; then check=instructions; else check="${BENCH}"; fi
          python/.venv/bin/python3 -m tools.benchmark_gate --bench "${check}"

      # Print + upload after the gate, the instruction counts among them.
      - name: Print the result JSON
        if: always()
        run: |
          set -euo pipefail
          for f in benchmarks/results/*_"${BENCH}".json; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            cat "$f"
            echo
          done

      - name: Upload benchmark results
        if: always() && env.LANE_MEASURES != '0'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ env.BENCH }}-results
          path: benchmarks/results/*.json
          if-no-files-found: warn

      # Save ccache (split-save like pr-full-ci: `!cancelled()` so it persists
      # even if the regression gate above failed; skip on an exact-sha re-run
      # hit, since GHA cache keys are immutable).
      - name: Save ccache (benchmark lane)
        if: ${{ env.LANE_MEASURES != '0' && !cancelled() && steps.ccache-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-bench-${{ runner.os }}-clang23-${{ github.sha }}

      # Save the FetchContent deps (populated during the cmake configure above)
      # even if a later step failed — `!cancelled()` matches the ccache save.
      # Skip on an exact-key hit (immutable keys); the key is content-addressed
      # on CMakeLists.txt, so on a re-run with unchanged deps this no-ops.
      - name: Save C++ FetchContent deps (benchmark lane)
        if: ${{ env.LANE_MEASURES != '0' && !cancelled() && steps.cpp-deps-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: cpp/build/_deps
          key: cpp-deps-bench-${{ runner.os }}-${{ hashFiles('cpp/CMakeLists.txt') }}
