# SPDX-License-Identifier: BSD-2-Clause
#
# Phase 2 of the skipped-gate cleanup (Phase 1 = actionlint in pr-full-ci.yml).
# The three heavy opt-in lanes that `tools/run_ci.py` skips by default —
# reproducible-build, stability bench, mutation testing — run here as separate
# PARALLEL jobs, OFF the required sweep's critical path (ready-time = max, not
# sum).  Each invokes the lane TOOL directly (not `run_ci --<lane>`, which would
# redundantly re-run the whole ~36-min base sweep already covered by
# pr-full-ci.yml).
#
# Enforcement split (see BRANCH_PR_HYGIENE):
#   * reproducible-build — DETERMINISTIC (two clean builds, sha256 compare);
#     intended to become a REQUIRED check.  Runs on every PR event so the
#     required status always reflects the latest commit.
#   * mutation testing — REQUIRED (2026-06-20).  The drift gate is baseline-
#     relative (fails only on a collection crash OR observed survivors > the
#     recorded baseline), and this project's suite is deterministic (no physical
#     time in tests), so it is a stable merge-blocking signal — not "score-
#     squishy".  The lane already ran on every PR; advisory merely discarded a
#     signal we already paid to compute.  Add `mutation testing` to the `main`
#     branch ruleset's required checks to activate it (do so only after a
#     fresh-branch run confirms the seeded caches hit — see below).
#   * stability bench — ADVISORY (genuinely timing-flaky).  NOT required.
#   Each runs on EVERY PR commit-state (incl. synchronize) so the result
#   reflects the latest commit — a `synchronize`-skip froze them at the PR's
#   first (often broken) commit.  Per-job `cancel-in-progress` collapses rapid
#   PR iteration to ~one run on the settled state (AGENTS.md cat 14g's "once per
#   PR, not per-commit", via cancellation not a skip) — but push:main is EXEMPT
#   from cancellation so a rapid second merge cannot kill a cache-seeding run
#   before it saves.  `workflow_dispatch` remains for manual re-runs.
#
# Toolchain steps are copied verbatim from pr-full-ci.yml (same cache keys, so
# these jobs hit the Agda store that workflow already populated).  The workflow
# ALSO runs on push:main: the heavy caches (Mull-from-source, the build tree)
# are otherwise only written on feature branches, which do NOT cross-pollinate,
# so a fresh PR branch would miss them, and the mutation lanes pay for the .so
# build from cold — the C++ legs additionally for Mull and their mutation tree.
# A push:main run writes those caches under the default branch, where every PR
# branch can read them — turning the cold Mull build (318s) + .so build (338s)
# into hits.

name: Heavy lanes (PR)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GHC_VERSION: '9.8.4'
  AGDA_VERSION: '2.8.0'
  STDLIB_VERSION: 'v2.4'

jobs:
  # ── Lane 1: reproducible-build (REQUIRED-intended; deterministic) ──────────
  # Self-building: tools.check_reproducible_build runs `cabal run shake -- build`
  # twice and compares sha256(build/libaletheia-ffi.so).  Needs only the Agda
  # toolchain + a 3.14 python to invoke the tool (no venv extras, no C++/Go).
  reproducible-build:
    name: reproducible-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Runs on every PR commit-state AND on push:main (to seed the build caches —
    # see the header).  Push-iteration hygiene: a new PR commit cancels the stale
    # repro run (push:main is exempt, below).  Its OWN group, so it never cancels
    # the stability / mutation lanes below.
    concurrency:
      group: heavy-repro-${{ github.event.pull_request.number || github.ref }}
      # push:main is exempt — a seeding run must not be cancelled before it saves.
      cancel-in-progress: ${{ github.event_name != 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up GHC + cabal
        run: |
          set -euo pipefail
          echo "CABAL_DIR=${HOME}/.cabal" >> "${GITHUB_ENV}"
          export CABAL_DIR="${HOME}/.cabal"
          sudo chown -R "$(id -un):$(id -gn)" /usr/local/.ghcup 2>/dev/null || true
          ghcup install ghc "${GHC_VERSION}" --set
          ghcup install cabal 3.16.1.0 --set
          echo "${HOME}/.cabal/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.ghcup/bin" >> "${GITHUB_PATH}"

      - name: Restore cabal store (Agda library + executable + deps)
        id: cabal-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            ~/.cabal/bin
          key: cabal-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-agda${{ env.AGDA_VERSION }}-v2

      # cabal's package index lives in the restored ~/.cabal/packages, so a fresh
      # `cabal update` is redundant on a cache hit — and running it unconditionally
      # before the restore made this lane hostage to the hackage-security bootstrap
      # (the fresh TUF root.json fetch), which fails during a Hackage root-metadata
      # outage even though the primary is up. Run it only on a miss (mirrors
      # pr-full-ci.yml), where `cabal install Agda` below needs a current index.
      - name: Update cabal package index (only on a cabal-store cache miss)
        if: steps.cabal-cache.outputs.cache-hit != 'true'
        run: cabal update

      - name: Install Agda ${{ env.AGDA_VERSION }} (binary + store library)
        run: cabal install "Agda-${AGDA_VERSION}" --overwrite-policy=always

      - name: Save cabal store (only on a cache miss)
        if: steps.cabal-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            ~/.cabal/bin
          key: cabal-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-agda${{ env.AGDA_VERSION }}-v2

      - name: Cache agda-stdlib ${{ env.STDLIB_VERSION }}
        uses: actions/cache@v6
        with:
          path: ~/.agda/agda-stdlib
          key: agda-stdlib-${{ env.STDLIB_VERSION }}

      - name: Install + register agda-stdlib ${{ env.STDLIB_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p ~/.agda
          if [ ! -d ~/.agda/agda-stdlib/.git ]; then
            git clone --depth 1 --branch "${STDLIB_VERSION}" \
              https://github.com/agda/agda-stdlib.git ~/.agda/agda-stdlib
          fi
          echo "${HOME}/.agda/agda-stdlib/standard-library.agda-lib" > ~/.agda/libraries
          echo "standard-library" > ~/.agda/defaults

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Reproducible-build hash gate (two clean builds, sha256 compare)
        run: python3 -m tools.check_reproducible_build

  # ── Lane 2: stability bench (ADVISORY; once per PR) ────────────────────────
  stability:
    name: stability bench (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Runs on every PR commit-state (so the advisory result reflects the latest
    # commit) AND on push:main (to seed the build caches — see the header).
    # cancel-in-progress collapses rapid PR iteration to ~one run on the settled
    # state; push:main is exempt (below).  Own group so it never cancels the
    # repro / mutation lanes.
    concurrency:
      group: heavy-stability-${{ github.event.pull_request.number || github.ref }}
      # push:main is exempt — a seeding run must not be cancelled before it saves.
      cancel-in-progress: ${{ github.event_name != 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up GHC + cabal
        run: |
          set -euo pipefail
          echo "CABAL_DIR=${HOME}/.cabal" >> "${GITHUB_ENV}"
          export CABAL_DIR="${HOME}/.cabal"
          sudo chown -R "$(id -un):$(id -gn)" /usr/local/.ghcup 2>/dev/null || true
          ghcup install ghc "${GHC_VERSION}" --set
          ghcup install cabal 3.16.1.0 --set
          echo "${HOME}/.cabal/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.ghcup/bin" >> "${GITHUB_PATH}"

      - name: Restore cabal store (Agda library + executable + deps)
        id: cabal-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            ~/.cabal/bin
          key: cabal-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-agda${{ env.AGDA_VERSION }}-v2

      # cabal's package index lives in the restored ~/.cabal/packages, so a fresh
      # `cabal update` is redundant on a cache hit — and running it unconditionally
      # before the restore made this lane hostage to the hackage-security bootstrap
      # (the fresh TUF root.json fetch), which fails during a Hackage root-metadata
      # outage even though the primary is up. Run it only on a miss (mirrors
      # pr-full-ci.yml), where `cabal install Agda` below needs a current index.
      - name: Update cabal package index (only on a cabal-store cache miss)
        if: steps.cabal-cache.outputs.cache-hit != 'true'
        run: cabal update

      - name: Install Agda ${{ env.AGDA_VERSION }} (binary + store library)
        run: cabal install "Agda-${AGDA_VERSION}" --overwrite-policy=always

      - name: Save cabal store (only on a cache miss)
        if: steps.cabal-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            ~/.cabal/bin
          key: cabal-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-agda${{ env.AGDA_VERSION }}-v2

      - name: Cache agda-stdlib ${{ env.STDLIB_VERSION }}
        uses: actions/cache@v6
        with:
          path: ~/.agda/agda-stdlib
          key: agda-stdlib-${{ env.STDLIB_VERSION }}

      - name: Install + register agda-stdlib ${{ env.STDLIB_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p ~/.agda
          if [ ! -d ~/.agda/agda-stdlib/.git ]; then
            git clone --depth 1 --branch "${STDLIB_VERSION}" \
              https://github.com/agda/agda-stdlib.git ~/.agda/agda-stdlib
          fi
          echo "${HOME}/.agda/agda-stdlib/standard-library.agda-lib" > ~/.agda/libraries
          echo "standard-library" > ~/.agda/defaults

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Create the dev venv (python/.venv)
        run: |
          set -euo pipefail
          python3.14 -m venv python/.venv
          python/.venv/bin/pip install --upgrade pip
          python/.venv/bin/pip install -e 'python/.[dev]'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: |
            go/go.sum
            go/excel/go.sum

      - name: Cache clang-23 .debs (Clang is a large download)
        uses: actions/cache@v6
        with:
          path: ~/llvm-cache
          key: clang23-libstdcxx15-noble-v1
      # ubuntu-24.04 pre-installs only clang ≤19; install clang-23 (the supported
      # toolchain) from apt.llvm.org.  The cmake step below invokes clang-23
      # explicitly, so no update-alternatives is needed.
      - name: Install C++ toolchain (clang-23 from apt.llvm.org)
        run: |
          set -euo pipefail
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm23.list >/dev/null
          # ubuntu-24.04 ships libstdc++ 14, whose std::ranges::to has no pipe
          # form; the toolchain policy tracks the latest stable release rather
          # than a floor, so take 15 from the toolchain PPA the same way clang
          # comes from apt.llvm.org.  add-apt-repository is used here, rather
          # than the hand-written deb line the runtime image needs, only
          # because the runners already carry it and it fetches the key.
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          mkdir -p ~/llvm-cache
          if [ -z "$(ls -A ~/llvm-cache 2>/dev/null)" ]; then
            sudo apt-get install -y --download-only \
              -o Dir::Cache::archives="${HOME}/llvm-cache" \
              clang-23 clang-tidy-23 libstdc++-15-dev
            sudo chown -R "$(id -u):$(id -g)" ~/llvm-cache
          fi
          sudo dpkg -i ~/llvm-cache/*.deb || sudo apt-get -f install -y

      # stability_run errors if these are absent (build/libaletheia-ffi.so and
      # cpp/build/stability_bench).  Build them up front; the Go harness is
      # built/run by the runner itself.
      - name: Build the FFI library + C++ stability harness
        run: |
          set -euo pipefail
          cabal run shake -- build
          # -S cpp: the CMakeLists.txt lives in cpp/, not the repo root (the
          # default source dir when only -B is given).  The first run failed
          # with "source directory does not contain CMakeLists.txt".
          cmake -S cpp -B cpp/build -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23 > /dev/null
          cmake --build cpp/build --target stability_bench

      # Retry-once-on-failure (jitter watch, 2026-07-02): the drift gate flaked
      # on runtime-neutral PRs (#118 doc-only, #125 C++-only — provably runner
      # jitter, not regressions).  A failed first attempt re-runs ONCE; the
      # first attempt's per-binding variance JSONs are preserved and uploaded
      # as the `stability-variance-attempt1` artifact.  TALLY: each retry emits
      # a `FLAKE-RETRY` warning annotation + step-summary line, and leaves the
      # attempt1 artifact — count retries across runs with:
      #   gh api /repos/OWNER/REPO/actions/artifacts --paginate \
      #     --jq '[.artifacts[] | select(.name | test("attempt1"))] | length'
      # CI-only behavior: local runs keep the manual-rerun discipline.
      - name: Stability bench (advisory; retry-once on failure)
        env:
          ALETHEIA_STABILITY_CHECK: '1'
        run: |
          set -euo pipefail
          if python/.venv/bin/python3 -m tools.stability_run; then
            exit 0
          fi
          echo "::warning title=FLAKE-RETRY::stability bench failed on attempt 1 — retrying once (runner jitter suspected; see the jitter watch)"
          {
            echo "## ⚠ FLAKE-RETRY: stability bench"
            echo ""
            echo "Attempt 1 failed the variance drift gate; the harness re-ran once."
            echo "If attempt 2 passes, attempt 1 was runner jitter. First-attempt"
            echo "per-binding JSONs are in the stability-variance-attempt1 artifact."
          } >> "${GITHUB_STEP_SUMMARY}"
          mkdir -p stability-attempt1
          # Non-fatal (a failure before any JSON was written has nothing to
          # copy, and the retry must still run) but VOCAL — a real copy failure
          # must not silently lose the attempt-1 evidence.
          cp -r benchmarks/stability/. stability-attempt1/ \
            || echo "::warning title=FLAKE-RETRY::could not preserve attempt-1 stability JSONs (none written before the failure?)"
          python/.venv/bin/python3 -m tools.stability_run

      # Always upload the per-binding variance JSONs — before this step the
      # exact CV that breached a failing run was unrecoverable (the jitter
      # watch's diagnosis gap).
      - name: Upload stability variance JSONs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stability-variance
          path: benchmarks/stability/
          if-no-files-found: warn

      - name: Upload first-attempt variance JSONs (only exists on a retry)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stability-variance-attempt1
          path: stability-attempt1/
          if-no-files-found: ignore

  # ── Lane 3: mutation testing (REQUIRED; once per PR) ───────────────────────
  # The drift gate (tools/mutation_run.py) fails on a collection crash OR
  # observed survivors > the docs/MUTATION_BENCH.yaml baseline.  It runs once
  # per binding, in parallel: the three tools cost wildly different amounts and
  # a single job charges the slowest of them against a clock the other two have
  # already spent.  The C++ binding is two legs, one per mutation tree, and
  # the `mutation cpp` job below merges them into the one C++ verdict; a leg
  # judges no survivor, since a mutant one tree let live may die in the other.
  # The `mutation testing` job at the end of this file is what the main branch
  # ruleset requires; it is the one that reports these lanes.
  mutation-lane:
    name: mutation ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # One lane's regression must not cancel the others: a cancelled sweep
      # reports nothing, and the reason to split them was to learn what each
      # costs.  Every lane runs to its own verdict.
      fail-fast: false
      matrix:
        include:
          # Each lane names the bindings it skips, rather than deriving them
          # from its own name: the derivation would rest on how GitHub casts
          # the string it yields, and the failure it casts wrong is a lane that
          # skips all three, runs nothing and reports success.  `lane` is the
          # job's name and its artifact's; `stage` is what the C++ runner is
          # told (tools/mutation_cpp.py `CppStage`), empty for the other two.
          #
          # Every budget is read off a measurement: the lane's slowest recorded
          # wall clock plus the allowance for its caches missing, rounded up
          # to five minutes.  The allowance is what a cold run paid, measured
          # on run 30150643321 (the toolchain bump, every cache cold): the Agda
          # install 18m34s and the FFI build 9m08s, 27m42s; a C++ leg adds the
          # Mull build, 5m35s on run 35486430315, 33m17s.  The slowest walls
          # are run 35486430315's (push:main, 1037 C++ mutants): python 8m20s,
          # go 18m48s; a C++ leg is that job's warm setup, 3m41s, plus its own
          # tree's build and sweep, leak 7m48s + 33m14s = 44m43s and plain
          # 8m09s + 45m41s = 57m31s, the builds of that run compiling one unit
          # at a time where the runner now builds four at once.  So python
          # 36m02s, go 46m30s, leak 78m00s, plain 90m48s, each rounded up.
          # Each budget is the slowest run recorded, so a faster one leaves it
          # where it is.  A budget is a measurement of the
          # surface it was read from: it is re-taken when the mutation surface
          # changes or a run exceeds it, from `elapsed_s` in the lane's
          # summary.json (a leg's, and `cpp-legs.json` beside the merge's).
          - lane: python
            binding: python
            stage: ''
            timeout: 40
            skip_python: ''
            skip_go: '1'
            skip_cpp: '1'
          - lane: go
            binding: go
            stage: ''
            timeout: 50
            skip_python: '1'
            skip_go: ''
            skip_cpp: '1'
          - lane: cpp-leak
            binding: cpp
            stage: leak
            timeout: 80
            skip_python: '1'
            skip_go: '1'
            skip_cpp: ''
          - lane: cpp-plain
            binding: cpp
            stage: plain
            timeout: 95
            skip_python: '1'
            skip_go: '1'
            skip_cpp: ''
    # Runs on every PR commit-state (so the required result reflects the latest
    # commit) AND on push:main (to seed the build caches — see the header).
    # cancel-in-progress collapses rapid PR iteration to ~one run on the settled
    # state; push:main is exempt (below).  Per-lane group so the lanes never
    # cancel each other (the two C++ legs included), nor the repro / stability
    # lanes.
    concurrency:
      group: heavy-mutation-${{ matrix.lane }}-${{ github.event.pull_request.number || github.ref }}
      # push:main is exempt — a seeding run must not be cancelled before it saves.
      cancel-in-progress: ${{ github.event_name != 'push' }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure a local `main` ref for `git diff main...HEAD`
        run: git fetch --no-tags origin +refs/heads/main:refs/heads/main || true

      - name: Set up GHC + cabal
        run: |
          set -euo pipefail
          echo "CABAL_DIR=${HOME}/.cabal" >> "${GITHUB_ENV}"
          export CABAL_DIR="${HOME}/.cabal"
          sudo chown -R "$(id -un):$(id -gn)" /usr/local/.ghcup 2>/dev/null || true
          ghcup install ghc "${GHC_VERSION}" --set
          ghcup install cabal 3.16.1.0 --set
          echo "${HOME}/.cabal/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.ghcup/bin" >> "${GITHUB_PATH}"

      - name: Restore cabal store (Agda library + executable + deps)
        id: cabal-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            ~/.cabal/bin
          key: cabal-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-agda${{ env.AGDA_VERSION }}-v2

      # cabal's package index lives in the restored ~/.cabal/packages, so a fresh
      # `cabal update` is redundant on a cache hit — and running it unconditionally
      # before the restore made this lane hostage to the hackage-security bootstrap
      # (the fresh TUF root.json fetch), which fails during a Hackage root-metadata
      # outage even though the primary is up. Run it only on a miss (mirrors
      # pr-full-ci.yml), where `cabal install Agda` below needs a current index.
      - name: Update cabal package index (only on a cabal-store cache miss)
        if: steps.cabal-cache.outputs.cache-hit != 'true'
        run: cabal update

      - name: Install Agda ${{ env.AGDA_VERSION }} (binary + store library)
        run: cabal install "Agda-${AGDA_VERSION}" --overwrite-policy=always

      - name: Save cabal store (only on a cache miss)
        if: steps.cabal-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            ~/.cabal/bin
          key: cabal-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-agda${{ env.AGDA_VERSION }}-v2

      - name: Cache agda-stdlib ${{ env.STDLIB_VERSION }}
        uses: actions/cache@v6
        with:
          path: ~/.agda/agda-stdlib
          key: agda-stdlib-${{ env.STDLIB_VERSION }}

      - name: Install + register agda-stdlib ${{ env.STDLIB_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p ~/.agda
          if [ ! -d ~/.agda/agda-stdlib/.git ]; then
            git clone --depth 1 --branch "${STDLIB_VERSION}" \
              https://github.com/agda/agda-stdlib.git ~/.agda/agda-stdlib
          fi
          echo "${HOME}/.agda/agda-stdlib/standard-library.agda-lib" > ~/.agda/libraries
          echo "standard-library" > ~/.agda/defaults

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Create the dev venv with the [mutation] extra (mutmut)
        run: |
          set -euo pipefail
          python3.14 -m venv python/.venv
          python/.venv/bin/pip install --upgrade pip
          python/.venv/bin/pip install -e 'python/.[dev,mutation]'

      - name: Set up Go + gremlins
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: |
            go/go.sum
            go/excel/go.sum

      - name: Install gremlins (Go mutation tool)
        if: matrix.binding == 'go'
        run: |
          set -euo pipefail
          go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"

      - name: Cache clang-23 + LLVM-23-dev .debs (large download)
        if: matrix.binding == 'cpp'
        uses: actions/cache@v6
        with:
          path: ~/llvm-cache
          key: clang23-llvm23dev-libstdcxx15-noble-v1
      # ubuntu-24.04 pre-installs only clang ≤19; install clang-23 (the supported
      # toolchain) + the LLVM-23 dev libraries (needed to build Mull from source)
      # from apt.llvm.org.  mutation_cpp.py invokes clang-23 explicitly.
      - name: Install C++ toolchain + LLVM-23 dev (apt.llvm.org)
        if: matrix.binding == 'cpp'
        run: |
          set -euo pipefail
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm23.list >/dev/null
          # ubuntu-24.04 ships libstdc++ 14, whose std::ranges::to has no pipe
          # form; the toolchain policy tracks the latest stable release rather
          # than a floor, so take 15 from the toolchain PPA the same way clang
          # comes from apt.llvm.org.  add-apt-repository is used here, rather
          # than the hand-written deb line the runtime image needs, only
          # because the runners already carry it and it fetches the key.
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          mkdir -p ~/llvm-cache
          if [ -z "$(ls -A ~/llvm-cache 2>/dev/null)" ]; then
            sudo apt-get install -y --download-only \
              -o Dir::Cache::archives="${HOME}/llvm-cache" \
              clang-23 libstdc++-15-dev llvm-23-dev libclang-23-dev
            sudo chown -R "$(id -u):$(id -g)" ~/llvm-cache
          fi
          sudo dpkg -i ~/llvm-cache/*.deb || sudo apt-get -f install -y

      # No prebuilt Mull deb exists past LLVM 15, and the supported toolchain is
      # clang-23: UB can differ by compiler version, so the mutation lane MUST
      # test clang-23 codegen.  tools/build_mull.sh builds Mull from source
      # against the system LLVM-23 (Bazel; /usr/lib/llvm-23), carrying the patch
      # Mull 0.34.1 needs to see LLVM 23.  Cached so it is a one-time cost per
      # build: the key hashes tools/build_mull.sh, which pins the Mull tag and
      # the LLVM version, and every patch under tools/mull/ the script applies,
      # so any change to what is built misses the cache rather than replaying
      # the previous binaries.  Both C++ legs restore this key and the clang
      # one; on a miss each builds Mull and each tries to save, and the second
      # save of a key is logged as a warning by the action, not a failure.
      - name: Cache Mull-23 (built from source vs LLVM-23)
        if: matrix.binding == 'cpp'
        id: mull23
        uses: actions/cache@v6
        with:
          path: ~/mull-bin
          key: mull23-noble-${{ hashFiles('tools/build_mull.sh', 'tools/mull/*.patch') }}
      - name: Build Mull-23 from source (cache miss)
        if: matrix.binding == 'cpp' && steps.mull23.outputs.cache-hit != 'true'
        run: tools/build_mull.sh "${HOME}/mull-bin"
      - name: Install Mull-23 to PATH
        if: matrix.binding == 'cpp'
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          cp "${HOME}/mull-bin/"mull-* "${HOME}/.local/bin/"
          chmod +x "${HOME}/.local/bin/mull-runner-23" "${HOME}/.local/bin/mull-reporter-23"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # Restore the build tree (Agda .agdai + MAlonzo .hs + the copied .so, plus
      # the shake-exe root dist-newstyle) so `cabal run shake -- build` below is a
      # Shake NO-OP when the PR touches no Agda source — the common case (a
      # Python/Go/C++/docs PR doesn't change the .so), turning the cold ~338s
      # build into seconds.  Includes haskell-shim/dist-newstyle (the foreign
      # lib's ~194 MB .o/.hi tree): it is the cabal foreign-lib build state that
      # build/libaletheia-ffi.so is copied out of (Shakefile.hs `cp`), so
      # leaving it uncached forced cabal to recompile all 276 MAlonzo objects
      # (~47s) on EVERY run, not just Agda-changing ones.  Caching it lets cabal
      # skip the recompile (~0s work when nothing changed) — verified locally:
      # churn every mtime (the actions/cache
      # restore) and `build` still no-ops with an unchanged .so md5.  Shares
      # pr-full-ci.yml's key (SAME tree, seeded on push:main, so a fresh PR
      # branch reads it via the restore-keys prefix); safe to share — Shake keys
      # on content and `build` errors on a stale tree, so it never ships stale.
      # NOT ccache: the Mull `-fpass-plugin` C++ compile is left cold (ccache
      # cannot content-hash the plugin binary -> stale-object risk).
      - name: Restore incremental build tree (build/ + dist-newstyle/)
        id: build-tree-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build
            dist-newstyle
            haskell-shim/dist-newstyle
          key: build-tree-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-agda${{ env.AGDA_VERSION }}-stdlib${{ env.STDLIB_VERSION }}-${{ github.sha }}
          restore-keys: |
            build-tree-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-agda${{ env.AGDA_VERSION }}-stdlib${{ env.STDLIB_VERSION }}-

      - name: Build the FFI library (needed by mutmut / Mull / gremlins lanes)
        run: cabal run shake -- build

      - name: Mutation testing (${{ matrix.lane }})
        env:
          ALETHEIA_MUTATION_CHECK: '1'
          # The runner drives every binding it is not told to skip, and logs
          # each skip, so a lane's log states which binding it covered.
          ALETHEIA_MUTATION_SKIP_PYTHON: ${{ matrix.skip_python }}
          ALETHEIA_MUTATION_SKIP_GO: ${{ matrix.skip_go }}
          ALETHEIA_MUTATION_SKIP_CPP: ${{ matrix.skip_cpp }}
          # Which C++ tree this lane sweeps; empty means the whole lane, which
          # no lane here runs, since each tree is a leg of its own.
          ALETHEIA_MUTATION_CPP_STAGE: ${{ matrix.stage }}
        run: python/.venv/bin/python3 -m tools.mutation_run

      # Every lane's reports leave the runner whatever ended the lane: a C++
      # leg's reports are what the `mutation cpp` job merges, and a lane its
      # clock killed leaves the partial directory that says how far it got.
      # `overwrite`, because that killed lane is the one a reader re-runs, its
      # first attempt uploaded under this name, and a second upload of a name
      # fails the step rather than the sweep, hiding the result behind it.
      - name: Upload the lane's reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-${{ matrix.lane }}
          path: benchmarks/mutation/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      # Seed the build tree so push:main writes it under the default branch for
      # fresh PR branches to restore.  NOT gated to pull_request (push:main is
      # the seeding event); `!cancelled()` avoids saving a truncated tree; skip
      # when the exact-sha key already exists (a re-run / the sibling workflow
      # saved first — GHA cache keys are immutable).  One lane saves, because
      # that immutability makes a second writer of the same key a logged
      # failure rather than a no-op; the Python lane reaches it soonest and is
      # the least likely of the three to run out of clock before it does.
      - name: Save incremental build tree
        if: ${{ !cancelled() && matrix.binding == 'python' && steps.build-tree-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            build
            dist-newstyle
            haskell-shim/dist-newstyle
          key: build-tree-${{ runner.os }}-ghc${{ env.GHC_VERSION }}-agda${{ env.AGDA_VERSION }}-stdlib${{ env.STDLIB_VERSION }}-${{ github.sha }}

  # ── The C++ verdict ────────────────────────────────────────────────────────
  # The two C++ legs above each sweep one mutation tree and have no verdict of
  # their own.  This job downloads both legs' reports and merges them, which
  # is where the survivors are counted against the baseline and the ledger
  # (tools/mutation_cpp.py, stage `merge`).  It runs whatever the lanes'
  # results, so a Python or Go failure does not erase the C++ verdict; its own
  # pass needs both legs' complete report sets from this commit, and a leg its
  # clock killed uploaded no Elements report, which the merge refuses.
  mutation-cpp:
    name: mutation cpp
    runs-on: ubuntu-24.04
    needs: [mutation-lane]
    if: ${{ always() }}
    timeout-minutes: 15
    concurrency:
      group: heavy-mutation-cpp-merge-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name != 'push' }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The runner scopes the run by `git diff main...HEAD`, as the legs did.
      - name: Ensure a local `main` ref for `git diff main...HEAD`
        run: git fetch --no-tags origin +refs/heads/main:refs/heads/main || true

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Create the dev venv
        run: |
          set -euo pipefail
          python3.14 -m venv python/.venv
          python/.venv/bin/pip install --upgrade pip
          python/.venv/bin/pip install -e 'python/.[dev,mutation]'

      # One directory per leg artifact under mutation-legs/; the merge wants
      # each tree's reports exactly once, wherever they are under it.
      - name: Download the C++ legs' reports
        uses: actions/download-artifact@v8
        with:
          pattern: mutation-cpp-*
          path: mutation-legs

      - name: Merge the legs (the C++ drift gate)
        env:
          ALETHEIA_MUTATION_CHECK: '1'
          ALETHEIA_MUTATION_SKIP_PYTHON: '1'
          ALETHEIA_MUTATION_SKIP_GO: '1'
          ALETHEIA_MUTATION_CPP_STAGE: merge
          ALETHEIA_MUTATION_CPP_LEGS: mutation-legs
        run: python/.venv/bin/python3 -m tools.mutation_run

      - name: Upload the merged reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-cpp
          path: benchmarks/mutation/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  # ── The required check ─────────────────────────────────────────────────────
  # `mutation testing` is the context the main branch ruleset requires, so it
  # must keep that exact name however the work behind it is arranged.  It
  # reports the lanes and the C++ merge above and adds nothing of its own: it
  # passes on the one result meaning every one of them finished clean, and
  # refuses every other, whichever of them the platform uses for a job its own
  # `timeout-minutes` killed.  Silence about a lane is never a pass.
  mutation:
    name: mutation testing
    runs-on: ubuntu-24.04
    needs: [mutation-lane, mutation-cpp]
    # `always()`, so no arrangement of lane results can leave this job skipped:
    # a skipped job reporting a required context is a context that cannot fail,
    # and a lane killed by its clock is exactly when a narrower condition would
    # skip it.  The cost is that a run superseded by a newer push, whose lanes
    # cancel-in-progress, reports this check red on the commit it has already
    # replaced.  That is accepted: required checks resolve per commit, so it
    # blocks nothing, and every way of reading supersession off the run is also
    # satisfied by a genuine timeout, which would then pass the gate over a
    # lane that never finished.
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Every mutation lane and the C++ merge reached a verdict and it was success
        env:
          LANES: ${{ toJSON(needs.mutation-lane) }}
          LANES_RESULT: ${{ needs.mutation-lane.result }}
          CPP: ${{ toJSON(needs.mutation-cpp) }}
          CPP_RESULT: ${{ needs.mutation-cpp.result }}
        run: |
          set -euo pipefail
          printf 'mutation lanes: %s\n' "${LANES}"
          printf 'mutation cpp: %s\n' "${CPP}"
          if [ "${LANES_RESULT}" != "success" ] || [ "${CPP_RESULT}" != "success" ]; then
            echo "::error::the mutation lanes (${LANES_RESULT}) and the C++ merge" \
                 "(${CPP_RESULT}) did not all succeed; a job killed by its own" \
                 "timeout-minutes arrives here as one of these non-success results"
            exit 1
          fi
          echo "every mutation lane and the C++ merge succeeded"
