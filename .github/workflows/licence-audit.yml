#
# The licence audit's scan (tools/licence_audit.py): downloads the source
# tarballs packaging/licenses/sources.yaml names for the libraries the bundle
# carries (GHC's, Agda's, each Agda library's), refuses one whose SHA-256 is
# not the one recorded, and reads their sources for code taken from another
# work, holding every hit to its verdict in packaging/licenses/audit.yaml.
#
# It runs where what it reads can change: on a pull request that touches the
# kept texts, their record or the verdicts, either tool that reads them or
# this workflow, and weekly on the default branch.  The release fetches nothing: every pull
# request's tools/run_ci.py runs `check-bundle-licences`, which holds the
# verdict file to the record (each tarball scanned at the SHA-256 recorded,
# every hit judged) without a tarball.  A path filter skips this workflow
# whole, so it defines no context the main ruleset requires.

name: Licence audit

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'packaging/licenses/**'
      - 'tools/licence_audit.py'
      - 'tools/bundle_licences.py'
      - '.github/workflows/licence-audit.yml'
  schedule:
    # Weekly, Monday early-UTC, an offset minute as bundle-validation.yml's.
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: licence-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: licence audit scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Create the dev venv (python/.venv)
        run: |
          set -euo pipefail
          python3.14 -m venv python/.venv
          python/.venv/bin/pip install --upgrade pip
          python/.venv/bin/pip install -e 'python/.[dev]'

      - name: Download the tarballs the record names
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tarballs"
          python/.venv/bin/python3 -m tools.licence_audit wanted "${RUNNER_TEMP}/tarballs" |
            while IFS=$'\t' read -r url path; do
              curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o "${path}" "${url}"
            done

      - name: Scan them against the verdicts
        run: python/.venv/bin/python3 -m tools.licence_audit scan "${RUNNER_TEMP}/tarballs"
