# The C++ wrapper's object layout: the size and alignment in bytes of every class,
# struct, enum and type alias the public headers under cpp/include/aletheia/
# declare at namespace scope, outside a detail or unnamed namespace and not a
# template, and the SOVERSION of the shared library they belong to. A program
# linked against libaletheia-cpp holds these types by value, so a change to any
# row is one every such program is rebuilt for: it bumps SOVERSION in
# cpp/CMakeLists.txt, carries the breaking mark on its subject, and re-takes the
# rows from the C++ layout test's output. A break no row shows (a virtual
# function added, a signature or an enumerator's value changed) bumps SOVERSION
# on its own, under the same mark; the version never falls.
#
# The figures are a measurement of the toolchain CI builds and tests with (Clang
# 23 with libstdc++) in the shipped build, not a target: another standard library
# lays the containers out otherwise, and so do the mutation tree's debug-mode
# containers, which are not measured.
# tools/check_cpp_layout.py holds the roster to the headers and this soversion
# to CMake's and to a rise wherever the rows moved; cpp/tests/test_cpp_layout.cpp
# holds the figures to the compiler; tools/check_pr_title.py refuses a change to
# this file without the breaking mark.

