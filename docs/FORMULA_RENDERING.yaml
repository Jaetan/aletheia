                }
              }
            },
            "timebound": 2000000
          },
          "operator": "metricRelease",
          "right": {
            "formula": {
              "operator": "atomic",
              "predicate": {
                "predicate": "equals",
                "signal": "Speed",
                "value": 1
              }
            },
