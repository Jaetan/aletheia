# Single source of truth for the long-run stability sub-checks each binding's
# stability harness must implement.  Drives `tools/check_stability_bench.py`
# (static gate: a substring search verifies the file that makes each
# sub-check's read references the named symbol or function call).
#
# Scope: AGENTS.md universal rule "Long-run leak detection sub-checks"
# (Agda cat 16, Go cat 27, C++ cat 26, Python cat 25).
#
# One row per (binding, sub_check) pair, under its binding (python | go | cpp |
# agda), which names its `harness`, the path to the harness source from repo
# root.  Fields:
#   name:           stable identifier; for python, go and cpp, the name the
#                   binding's report gives the sub-check
#   gate:           hard_zero | soft_threshold
#                     hard_zero:        exact 0 drift after close+gc; spec calls
#                                       this a "genuine leak detector"
#                     soft_threshold:   empirically-tuned percentage / absolute
#                                       cap; threshold lives next to the
#                                       assertion in the harness, NOT in this
#                                       file.  This file declares "the check
#                                       must exist," not "the check must pass
#                                       at threshold X."
#   source_file:    optional, the path from repo root to the file that makes
#                   the sub-check's read, where that is not the harness
#   source_marker:  substring the static gate requires in source_file, or in
#                   the harness when the row names none, to verify the
#                   sub-check is wired in.  It is spelled once in that file,
#                   as the read's code spells it, so no comment or docstring
#                   stands for the read.

version: 1

bindings:
  python:
    harness: python/benchmarks/stability.py
    sub_checks:
      - name: rss
        gate: soft_threshold
        source_marker: "rss = psutil.Process().memory_info().rss"
      - name: fd_count
        gate: hard_zero
        source_marker: 'Path(psutil.PROCFS_PATH) / "self" / "fd"'
      - name: ctypes_handles
        gate: hard_zero
        source_marker: '"rts_refcount": RTSState.refcount'
      - name: logger_handlers
        gate: hard_zero
        source_marker: "logging.getLogger(LOGGER_NAME).handlers"

  go:
    harness: go/benchmarks/stability/main.go
    sub_checks:
      - name: rss
        gate: soft_threshold
        source_marker: "heap, err := readHeapBytes(metric)"
      - name: fd_count
        gate: hard_zero
        source_marker: "fds, err := fdCount()"
      - name: goroutines
        gate: hard_zero
        source_marker: "runtime.NumGoroutine()"
      - name: stableptr
        gate: hard_zero
        source_marker: "aletheia.StablePtrCount()"

  cpp:
    harness: cpp/benchmarks/stability_bench.cpp
    sub_checks:
      # The harness takes its snapshots through the snapshot header, which
      # makes the reads, so each row reads the header and is held at the
      # read's call.
      - name: rss
        gate: soft_threshold
        source_file: cpp/benchmarks/stability_snapshot.hpp
        source_marker: 'status_field(status, "VmRSS:")'
      - name: fd_count
        gate: hard_zero
        source_file: cpp/benchmarks/stability_snapshot.hpp
        source_marker: "fd_count(fds)"
      - name: active_thread_count
        gate: hard_zero
        source_file: cpp/benchmarks/stability_snapshot.hpp
        source_marker: 'status_field(status, "Threads:")'
      - name: malloc_info
        gate: soft_threshold
        source_file: cpp/benchmarks/stability_snapshot.hpp
        source_marker: "malloc_info_bytes(open, write)"

  agda:
    harness: tools/stability_run.py
    sub_checks:
      # The Agda lane's "harness" is the runner itself: it sets
      # ALETHEIA_RTS_OPTS=-hT (see python/aletheia/client/_ffi.py for the
      # env-var → hs_init_with_rtsopts plumbing) so the GHC RTS emits the
      # heap-typed profile during the Python lane's run.
      - name: heap_profile
        gate: soft_threshold
        source_marker: 'env["ALETHEIA_RTS_OPTS"] = "-hT"'
      - name: heap_profile_archive
        gate: hard_zero
        source_marker: 'artifact_dir / "aletheia-ffi.hp"'
