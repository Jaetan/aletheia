# SPDX-License-Identifier: BSD-2-Clause
# Aletheia Cross-CLI Behavior Contract
#
# Single source of truth for the behavior every Aletheia CLI must exhibit.
# The three CLIs —
#   * Python:  python -m aletheia        (python/aletheia/cli.py)
#   * Go:      go/cmd/aletheia           (built binary)
#   * C++:     aletheia-cli              (cpp/src/cli/cli.cpp, cpp/build/aletheia-cli)
# — are driven as REAL subprocesses by python/tests/test_cli_parity.py, which
# parametrizes (cli x scenario) over this file. A scenario that passes on one
# CLI and fails on another is a parity bug in the failing CLI, not in this file.
#
# Exit-code contract (holds in BOTH text and --json output modes):
#   0 = ok
#   1 = violations found / validation failed
#   2 = operational error (bad arguments, missing file, parse failure,
#       backend failure)
#
# Schema. The harness checks each scenario against it as it loads this file and
# refuses a key it does not name, a value of another type or outside the set
# given here, an empty id, subcommand, fixture, workbook path or substring, and
# fixture_exists without a fixture.
#   meta:
#     subcommands: the subcommands every CLI must expose; the harness
#       asserts each has >= 1 scenario below AND appears in each CLI's
#       --help/usage output.
#   scenarios[]:
#     id:         unique kebab-case scenario name (test parametrization key)
#     subcommand: one of meta.subcommands
#     args:       argv list appended after the subcommand; every entry is a
#                 string; the literal "{dbc}" placeholder is replaced with the
#                 absolute path of `fixture`, and "{tmp}" with a fresh empty
#                 directory the run may write into
#     fixture:    optional path relative to python/tests/fixtures/, required
#                 where an argument names "{dbc}"; no run may change it, and
#                 the harness compares its bytes before and after
#     fixture_exists: optional, default true. Set false ONLY for scenarios
#                 that exercise missing-file handling; the harness asserts
#                 existence (or intentional absence) either way, so a typo'd
#                 fixture name cannot silently turn a scenario into a
#                 missing-file test.
#     stdout:     optional; a standard output in place of the capture, each
#                 refusing a write: "full" is /dev/full (no space left on
#                 device), "closed" starts the program with descriptor 1 closed
#                 (bad file descriptor), "broken-pipe" is a pipe whose reader
#                 is gone (broken pipe), and "over-limit" a file under a
#                 one-block file-size limit (file too large). Such a run has
#                 nothing to read back, so neither its `expect` nor an
#                 override's pins stdout_contains or json.
#     expect:
#       exit:            required exact exit code (see contract above)
#       stdout_contains: optional substrings that must appear on stdout
#       stderr_contains: optional substrings that must appear on stderr
#       json:            optional path -> value pins; stdout is parsed as
#                        JSON first (use only on --json scenarios). A dotted
#                        path ("a.b") descends into objects. A path ending
#                        in "[]" pins list membership: its value is a list
#                        of partial objects, each of which must subset-match
#                        (all given keys equal) at least one element of the
#                        actual list.
#       writes_template: optional path, placeholders as in `args`, of a
#                        workbook the run must write: its sheets and their
#                        header rows are the Python Excel loader's, in order.
#     overrides:  optional per-CLI divergence, keyed "python" / "go" / "cpp";
#                 each entry may replace `args` and/or `expect` wholesale for
#                 that CLI. Allowed ONLY where a divergence has been ratified
#                 as intentional — record the rationale in a comment next to
#                 the override. None exist today: the pinned surface below is
#                 empirically identical across all three CLIs.
#
# Flag-shape note (verified against all three CLIs 2026-07-04): `extract`
# takes POSITIONAL <can_id> <data> plus --dbc in every CLI (there are no
# --id/--data flags anywhere); `mux-query` takes a positional <message>
# (CAN ID or name) plus --dbc. Flags may appear before or after positionals
# in all three CLIs.
#
# `format-dbc` emits the CANONICAL JSON form of the DBC in all three CLIs
# (never DBC text), so its pins are JSON-shaped substrings ("EngineStatus",
# the message id 256) rather than a "BO_ 256" line.

meta:
  subcommands:
    - validate
    - extract
    - signals
    - format-dbc
    - mux-query
    - template

scenarios:
  # -- validate --------------------------------------------------------------

  # minimal.dbc is structurally sound but carries one benign warning
  # (offset_scale_range on EngineSpeed); "Validation passed" is the common
  # prefix across all three text renderers.
  - id: validate-valid
    subcommand: validate
    args: ["--dbc", "{dbc}"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 0
      stdout_contains:
        - "Validation passed"

  # dupsig.dbc duplicates the EngineSpeed signal name inside EngineStatus:
  # 1 error (duplicate_signal_name) + 1 warning (offset_scale_range). The
  # warning MUST be listed alongside the error — a failing validation still
  # reports the full issue list, not just what killed it.
  - id: validate-duplicate-signal
    subcommand: validate
    args: ["--dbc", "{dbc}"]
    fixture: dbc_broken/dupsig.dbc
    expect:
      exit: 1
      stdout_contains:
        - "Validation FAILED"
        - "duplicate_signal_name"
        - "offset_scale_range"

  # Same DBC through --json: machine-readable report, same exit code 1.
  - id: validate-duplicate-signal-json
    subcommand: validate
    args: ["--dbc", "{dbc}", "--json"]
    fixture: dbc_broken/dupsig.dbc
    expect:
      exit: 1
      json:
        status: fail
        has_errors: true
        total_issues: 2
        "issues[]":
          - code: duplicate_signal_name
            severity: error
          - code: offset_scale_range
            severity: warning

  # midfile_bad.dbc corrupts the BO_ 512 line ("4" -> "X") at line 40: a
  # syntactic parse failure (no issue list), which is an operational error
  # (exit 2) with the kernel's position-exact message on stderr.  Column 22
  # is the corrupted "X" itself (the furthest-failure watermark — the exact
  # byte no grammar rule could accept), and the parenthetical reports where
  # the unparseable statement starts.
  - id: validate-syntax-error
    subcommand: validate
    args: ["--dbc", "{dbc}"]
    fixture: dbc_broken/midfile_bad.dbc
    expect:
      exit: 2
      stderr_contains:
        - "parse failed at line 40, column 22 (first unparseable statement starts at line 40, column 1)"

  # A --dbc path that does not exist is an operational error. The message
  # wording differs per CLI (Python: "DBC file not found", Go/C++:
  # "reading <path>"), so only the shared "Error:" prefix is pinned.
  - id: validate-missing-file
    subcommand: validate
    args: ["--dbc", "{dbc}"]
    fixture: dbc_broken/no_such_file.dbc
    fixture_exists: false
    expect:
      exit: 2
      stderr_contains:
        - "Error:"

  # cp1252_degree.dbc is the Windows-1252 encoding of a DBC whose unit is
  # "°C": every CLI reads the file byte for byte, so the degree sign's byte,
  # 0xB0, reaches the kernel as U+00B0 and is refused at the byte's line and
  # column, whatever the file's encoding.
  - id: validate-cp1252-degree
    subcommand: validate
    args: ["--dbc", "{dbc}"]
    fixture: dbc_broken/cp1252_degree.dbc
    expect:
      exit: 2
      stderr_contains:
        - "character at line 10, column 30 (code point 176) is outside the DBC character set"

  # byte_7f.dbc holds a DEL byte, 0x7F, inside a comment: the first byte above
  # the printable range, refused as the character of the same number.
  - id: validate-byte-7f
    subcommand: validate
    args: ["--dbc", "{dbc}"]
    fixture: dbc_broken/byte_7f.dbc
    expect:
      exit: 2
      stderr_contains:
        - "character at line 11, column 7 (code point 127) is outside the DBC character set"

  # byte_80.dbc holds 0x80 inside a comment: the first byte the readers
  # re-encode, which reaches the kernel as U+0080.
  - id: validate-byte-80
    subcommand: validate
    args: ["--dbc", "{dbc}"]
    fixture: dbc_broken/byte_80.dbc
    expect:
      exit: 2
      stderr_contains:
        - "character at line 11, column 7 (code point 128) is outside the DBC character set"

  # byte_ff.dbc holds 0xFF inside a comment: the last byte, which reaches the
  # kernel as U+00FF.
  - id: validate-byte-ff
    subcommand: validate
    args: ["--dbc", "{dbc}"]
    fixture: dbc_broken/byte_ff.dbc
    expect:
      exit: 2
      stderr_contains:
        - "character at line 11, column 7 (code point 255) is outside the DBC character set"

  # keyword_name.dbc names a signal `BO_`, a DBC keyword: the kernel refuses
  # the name as it reads it, with the line and column where it starts.
  - id: validate-keyword-name
    subcommand: validate
    args: ["--dbc", "{dbc}"]
    fixture: dbc_broken/keyword_name.dbc
    expect:
      exit: 2
      stderr_contains:
        - "identifier 'BO_' at line 10, column 6 is a DBC keyword"

  # long_name.dbc names a signal with 129 characters: the kernel refuses the
  # name at its 129th character, reporting its length and where it starts.
  - id: validate-long-name
    subcommand: validate
    args: ["--dbc", "{dbc}"]
    fixture: dbc_broken/long_name.dbc
    expect:
      exit: 2
      stderr_contains:
        - "identifier at line 10, column 6: identifier length 129 exceeds limit 128"

  # A positional the subcommand does not take is an operational error naming
  # it, whether a flag follows it or not.
  - id: validate-stray-positional
    subcommand: validate
    args: ["--dbc", "{dbc}", "stray"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: stray"

  - id: validate-stray-positional-json
    subcommand: validate
    args: ["--dbc", "{dbc}", "stray", "--json"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: stray"

  # "--" ends the flags: alone it leaves nothing to refuse, a token after it
  # is a positional, and validate takes none.
  - id: validate-double-dash-alone
    subcommand: validate
    args: ["--dbc", "{dbc}", "--"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 0
      stdout_contains:
        - "Validation passed"

  - id: validate-stray-after-double-dash
    subcommand: validate
    args: ["--dbc", "{dbc}", "--", "stray"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: stray"

  # A token spelled like a flag after "--" is a positional too, so a CLI that
  # drops the "--" and goes on reading flags is caught here.
  - id: validate-flag-after-double-dash
    subcommand: validate
    args: ["--dbc", "{dbc}", "--", "--json"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: --json"

  # A stray is refused before the DBC is read: a CLI reading it first would
  # report the missing file instead.
  - id: validate-stray-positional-missing-file
    subcommand: validate
    args: ["--dbc", "{dbc}", "stray"]
    fixture: dbc_broken/no_such_file.dbc
    fixture_exists: false
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: stray"

  # A report that cannot be written, text or --json, is an operational error
  # naming the write, here and in every subcommand that prints one.
  - id: validate-stdout-full
    subcommand: validate
    args: ["--dbc", "{dbc}"]
    fixture: dbc_corpus/minimal.dbc
    stdout: full
    expect:
      exit: 2
      stderr_contains:
        - "writing the report: No space left on device"

  - id: validate-stdout-full-json
    subcommand: validate
    args: ["--dbc", "{dbc}", "--json"]
    fixture: dbc_corpus/minimal.dbc
    stdout: full
    expect:
      exit: 2
      stderr_contains:
        - "writing the report: No space left on device"

  # A report that cannot be written outranks the validation's verdict: a
  # failing validation whose report is lost exits 2, not 1.
  - id: validate-duplicate-signal-json-stdout-full
    subcommand: validate
    args: ["--dbc", "{dbc}", "--json"]
    fixture: dbc_broken/dupsig.dbc
    stdout: full
    expect:
      exit: 2
      stderr_contains:
        - "writing the report: No space left on device"

  # A stdout closed when the program starts takes no report: the program does
  # not hand descriptor 1 to the next file it opens.
  - id: validate-stdout-closed
    subcommand: validate
    args: ["--dbc", "{dbc}"]
    fixture: dbc_corpus/minimal.dbc
    stdout: closed
    expect:
      exit: 2
      stderr_contains:
        - "writing the report: Bad file descriptor"

  # A pipe whose reader is gone refuses the report like a full device: the
  # write fails and is named, no signal ending the program first.
  - id: validate-stdout-broken-pipe-json
    subcommand: validate
    args: ["--dbc", "{dbc}", "--json"]
    fixture: dbc_corpus/minimal.dbc
    stdout: broken-pipe
    expect:
      exit: 2
      stderr_contains:
        - "writing the report: Broken pipe"

  # -- signals ---------------------------------------------------------------

  - id: signals-valid
    subcommand: signals
    args: ["--dbc", "{dbc}"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 0
      stdout_contains:
        - "EngineSpeed"

  # Non-validate subcommands do NOT degrade to a validation report: a DBC
  # that fails kernel validation kills them with an operational error.
  - id: signals-invalid-dbc
    subcommand: signals
    args: ["--dbc", "{dbc}"]
    fixture: dbc_broken/dupsig.dbc
    expect:
      exit: 2
      stderr_contains:
        - "validation failed"

  - id: signals-stray-positional
    subcommand: signals
    args: ["--dbc", "{dbc}", "stray"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: stray"

  - id: signals-stdout-full
    subcommand: signals
    args: ["--dbc", "{dbc}"]
    fixture: dbc_corpus/minimal.dbc
    stdout: full
    expect:
      exit: 2
      stderr_contains:
        - "writing the report: No space left on device"

  - id: signals-stray-after-double-dash
    subcommand: signals
    args: ["--dbc", "{dbc}", "--", "stray"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: stray"

  - id: signals-flag-after-double-dash
    subcommand: signals
    args: ["--dbc", "{dbc}", "--", "--json"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: --json"

  - id: signals-stray-positional-missing-file
    subcommand: signals
    args: ["--dbc", "{dbc}", "stray"]
    fixture: dbc_broken/no_such_file.dbc
    fixture_exists: false
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: stray"

  - id: signals-stdout-full-json
    subcommand: signals
    args: ["--dbc", "{dbc}", "--json"]
    fixture: dbc_corpus/minimal.dbc
    stdout: full
    expect:
      exit: 2
      stderr_contains:
        - "writing the report: No space left on device"

  - id: signals-stdout-broken-pipe
    subcommand: signals
    args: ["--dbc", "{dbc}"]
    fixture: dbc_corpus/minimal.dbc
    stdout: broken-pipe
    expect:
      exit: 2
      stderr_contains:
        - "writing the report: Broken pipe"

  # -- format-dbc ------------------------------------------------------------

  # Canonical JSON re-export via the Agda core: message name + id 256 must
  # appear (see the format-dbc note in the header — output is JSON, not
  # DBC text).
  - id: format-dbc-valid
    subcommand: format-dbc
    args: ["--dbc", "{dbc}"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 0
      stdout_contains:
        - "EngineStatus"
        - "256"

  - id: format-dbc-stray-positional
    subcommand: format-dbc
    args: ["--dbc", "{dbc}", "stray"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: stray"

  - id: format-dbc-stdout-full
    subcommand: format-dbc
    args: ["--dbc", "{dbc}"]
    fixture: dbc_corpus/minimal.dbc
    stdout: full
    expect:
      exit: 2
      stderr_contains:
        - "writing the report: No space left on device"

  - id: format-dbc-stray-after-double-dash
    subcommand: format-dbc
    args: ["--dbc", "{dbc}", "--", "stray"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: stray"

  - id: format-dbc-stray-positional-missing-file
    subcommand: format-dbc
    args: ["--dbc", "{dbc}", "stray"]
    fixture: dbc_broken/no_such_file.dbc
    fixture_exists: false
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: stray"

  # A report past the file-size limit is refused like a full device: the
  # write fails and is named, no signal ending the program first.
  - id: format-dbc-stdout-over-limit
    subcommand: format-dbc
    args: ["--dbc", "{dbc}"]
    fixture: dbc_corpus/minimal.dbc
    stdout: over-limit
    expect:
      exit: 2
      stderr_contains:
        - "writing the report: File too large"

  # -- extract ---------------------------------------------------------------

  # Positional <can_id> <data> in every CLI (see the flag-shape note in the
  # header). 8 data bytes match EngineStatus's DLC; EngineSpeed decodes to
  # exactly 1088 rpm (raw 0x1100 * 1/4) in all three CLIs.
  - id: extract-valid
    subcommand: extract
    args: ["256", "0011223344556677", "--dbc", "{dbc}"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 0
      stdout_contains:
        - "EngineSpeed"
        - "1088"

  # A positional past the ones the subcommand takes is an operational error
  # naming it, here and in mux-query and template.
  - id: extract-stray-positional
    subcommand: extract
    args: ["256", "0011223344556677", "--dbc", "{dbc}", "stray"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: stray"

  - id: extract-stdout-full
    subcommand: extract
    args: ["256", "0011223344556677", "--dbc", "{dbc}"]
    fixture: dbc_corpus/minimal.dbc
    stdout: full
    expect:
      exit: 2
      stderr_contains:
        - "writing the report: No space left on device"

  # "--" ends the flags: the positionals after it are the frame, and a token
  # spelled like a flag after them is one positional too many.
  - id: extract-after-double-dash
    subcommand: extract
    args: ["--dbc", "{dbc}", "--", "256", "0011223344556677"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 0
      stdout_contains:
        - "EngineSpeed"
        - "1088"

  - id: extract-flag-after-double-dash
    subcommand: extract
    args: ["--dbc", "{dbc}", "--", "256", "0011223344556677", "--json"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: --json"

  # Only the first "--" ends the flags; a second one is a positional, here one
  # too many.
  - id: extract-second-double-dash
    subcommand: extract
    args: ["--dbc", "{dbc}", "--", "256", "0011223344556677", "--"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: --"

  # Too few positionals is an operational error naming what the subcommand
  # requires, here and in mux-query and template. Go and C++ print the
  # command's own line, the Python CLI its argument parser's, so the shared
  # word is what is pinned.
  - id: extract-too-few
    subcommand: extract
    args: ["--dbc", "{dbc}", "256"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 2
      stderr_contains:
        - "require"

  - id: extract-stray-positional-missing-file
    subcommand: extract
    args: ["256", "0011223344556677", "--dbc", "{dbc}", "stray"]
    fixture: dbc_broken/no_such_file.dbc
    fixture_exists: false
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: stray"

  - id: extract-stdout-full-json
    subcommand: extract
    args: ["256", "0011223344556677", "--dbc", "{dbc}", "--json"]
    fixture: dbc_corpus/minimal.dbc
    stdout: full
    expect:
      exit: 2
      stderr_contains:
        - "writing the report: No space left on device"

  # -- mux-query -------------------------------------------------------------

  # Summary mode (no --mux/--value): message resolved by CAN ID 100, the
  # multiplexor summary lists the Mode multiplexor.
  - id: mux-query-valid
    subcommand: mux-query
    args: ["100", "--dbc", "{dbc}"]
    fixture: dbc_corpus/multiplexing.dbc
    expect:
      exit: 0
      stdout_contains:
        - "BasicMux"
        - "Mode:"

  # "--" ends the flags: the message after it is the positional, and the
  # summary is the one mux-query-valid pins.
  - id: mux-query-after-double-dash
    subcommand: mux-query
    args: ["--dbc", "{dbc}", "--", "100"]
    fixture: dbc_corpus/multiplexing.dbc
    expect:
      exit: 0
      stdout_contains:
        - "BasicMux"
        - "Mode:"

  - id: mux-query-stray-positional
    subcommand: mux-query
    args: ["100", "--dbc", "{dbc}", "stray"]
    fixture: dbc_corpus/multiplexing.dbc
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: stray"

  - id: mux-query-stdout-full
    subcommand: mux-query
    args: ["100", "--dbc", "{dbc}"]
    fixture: dbc_corpus/multiplexing.dbc
    stdout: full
    expect:
      exit: 2
      stderr_contains:
        - "writing the report: No space left on device"

  - id: mux-query-too-few
    subcommand: mux-query
    args: ["--dbc", "{dbc}"]
    fixture: dbc_corpus/multiplexing.dbc
    expect:
      exit: 2
      stderr_contains:
        - "require"

  - id: mux-query-stray-positional-missing-file
    subcommand: mux-query
    args: ["100", "--dbc", "{dbc}", "stray"]
    fixture: dbc_broken/no_such_file.dbc
    fixture_exists: false
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: stray"

  - id: mux-query-stdout-full-json
    subcommand: mux-query
    args: ["100", "--dbc", "{dbc}", "--json"]
    fixture: dbc_corpus/multiplexing.dbc
    stdout: full
    expect:
      exit: 2
      stderr_contains:
        - "writing the report: No space left on device"

  # -- template --------------------------------------------------------------

  # The blank workbook every CLI writes is one template: the sheets and header
  # rows the Python Excel loader reads. It is written through each binding's
  # own loader module, not the core.
  - id: template-writes
    subcommand: template
    args: ["{tmp}/checks.xlsx"]
    expect:
      exit: 0
      stdout_contains:
        - "Template written to "
      writes_template: "{tmp}/checks.xlsx"

  # A path that exists is refused: an operational error naming it, the file
  # left as it was. The fixture stands in for the existing file. Go's error
  # spells the sentence in lower case, so the shared tail is what is pinned.
  - id: template-existing-path
    subcommand: template
    args: ["{dbc}"]
    fixture: dbc_corpus/minimal.dbc
    expect:
      exit: 2
      stderr_contains:
        - "Error:"
        - "already exists"

  # A parent directory that does not exist is an operational error.
  - id: template-missing-parent
    subcommand: template
    args: ["{tmp}/missing/checks.xlsx"]
    expect:
      exit: 2
      stderr_contains:
        - "Error:"

  - id: template-stray-positional
    subcommand: template
    args: ["{tmp}/checks.xlsx", "stray"]
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: stray"

  # "--" ends the flags wherever it stands: ahead of the path, after it, or
  # ahead of a stray.
  - id: template-after-double-dash
    subcommand: template
    args: ["--", "{tmp}/checks.xlsx"]
    expect:
      exit: 0
      stdout_contains:
        - "Template written to "
      writes_template: "{tmp}/checks.xlsx"

  - id: template-double-dash-after-path
    subcommand: template
    args: ["{tmp}/checks.xlsx", "--"]
    expect:
      exit: 0
      stdout_contains:
        - "Template written to "
      writes_template: "{tmp}/checks.xlsx"

  - id: template-stray-after-double-dash
    subcommand: template
    args: ["{tmp}/checks.xlsx", "--", "stray"]
    expect:
      exit: 2
      stderr_contains:
        - "unrecognized arguments: stray"

  - id: template-too-few
    subcommand: template
    args: []
    expect:
      exit: 2
      stderr_contains:
        - "require"

  # The confirmation line is the template's report.
  - id: template-stdout-full
    subcommand: template
    args: ["{tmp}/checks.xlsx"]
    stdout: full
    expect:
      exit: 2
      stderr_contains:
        - "writing the report: No space left on device"

  # Template loads no kernel, so nothing but the program itself decides what a
  # closed stdout or a pipe whose reader is gone does to its confirmation.
  - id: template-stdout-closed
    subcommand: template
    args: ["{tmp}/checks.xlsx"]
    stdout: closed
    expect:
      exit: 2
      stderr_contains:
        - "writing the report: Bad file descriptor"

  - id: template-stdout-broken-pipe
    subcommand: template
    args: ["{tmp}/checks.xlsx"]
    stdout: broken-pipe
    expect:
      exit: 2
      stderr_contains:
        - "writing the report: Broken pipe"
