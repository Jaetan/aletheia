# Every imprecise Python type hint the tree holds, and the ratchet that keeps the
# list from growing. AGENTS/python.md cat 8: a hint is universally quantified, so
# `str`, `list[float]` or `dict[str, X]` claims the code handles any string, any
# list of floats, any key, which it does not. tools/check_precise_hints.py refuses
# an imprecise hint this file does not name, and refuses a row naming more hints
# than the file holds, because such a row is standing permission to write one back.
#
# A hint is imprecise when it holds `Any` or `object`, or a generic given no
# parameters; `str`, `int`, `float` or `bytes` anywhere, alone, in a union, inside
# a container or as a key; or three or more nested subscripts. A type alias is
# read by its right side and keyed as `type NAME = RIGHT`, however it is spelled,
# and a NewType over a shape by that shape, keyed by its own call; the type a
# cast names is read like any hint. The files read are every tracked Python file
# outside .archive/ and the Python each probe hands an interpreter.
#
# A row leaves this file by the change that types its hints. Adding a row needs
# user approval, on the same footing as a NOLINT suppression, and a row a foreign
# interface forces carries a `reason:`.
#
# Rows are keyed by file and by the hint's own text, as `ast.unparse` spells it,
# rather than by a line number, so an edit elsewhere in the file does not move
# them; `count` is how many hints in that file share the text.

