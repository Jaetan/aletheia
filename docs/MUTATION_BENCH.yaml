  rust:
    tool: cargo-mutants
    # Pinned exactly, for the reason mutmut is: two releases generate different
    # mutant sets, and a baseline is a count of one set.  The runner refuses
    # any other version; the workflow installs and caches this one.
    version: "27.1.0"
    install: |
      cargo install cargo-mutants --version 27.1.0 --locked
    hot_path:
      # The cat 14(g) Rust list: the response decoder, the DBC model, the
      # domain types and the FFI backend.  These are the files
      # rust/.cargo/mutants.toml names, so the static gate's list and the
      # tool's are one; a file added there is added here.
      - rust/src/response.rs
      - rust/src/dbc.rs
      - rust/src/types.rs
      - rust/src/backend.rs
    config:
      # cargo-mutants reads this from the crate it examines: the files above
      # and every feature on, as the suite is run everywhere else.
      examine: rust/.cargo/mutants.toml
    invocation: |
      # tools/mutation_rust.py sweeps scratch copies of the whole tree, HEAD
      # with the uncommitted diff applied, and runs cargo-mutants --in-place
      # inside each, one shard of the mutants per copy: the suite includes
      # the DBC corpus and the parity snapshots from above the crate at
      # compile time and reads the documents under docs/ at run time, so a
      # copy of the crate alone does not build (the probe over rust/ holds
      # that).  The tree itself never holds a mutant.
      ALETHEIA_MUTATION_SKIP_PYTHON=1 ALETHEIA_MUTATION_SKIP_GO=1 ALETHEIA_MUTATION_SKIP_CPP=1 \
        python/.venv/bin/python -m tools.mutation_run
    report: |
      # cargo-mutants writes every mutant's bucket and site to
      # mutants.out/outcomes.json under the directory --output names; the
      # console prints only what was missed.  The runner reads the file:
      # caught is killed, missed is survived, timed out is neither and is held
      # to the ceiling below, and unviable is a mutant that did not build.
    baseline:
      # The record is a measurement of the surface under the pinned tool: the
      # mutants generated and the unviable among them are properties of the
      # source and the tool, the survivors of the source and its tests, and
      # the probe over this file re-sweeps and compares all three.
      #
      # What the set is made of: for every function, its body replaced by
      # each value of its return type the tool can name (an empty or a
      # one-element vector, zero, one, the empty string, a nonsense string,
      # Ok of those, the unit, and Err of the error value the configuration
      # names), and every binary operator swapped for its neighbours (an
      # arithmetic operator for each other, a comparison for its boundary
      # and its negation).  A mutant that does not build is unviable, and
      # the tool counts it apart: a Result's Ok of a default where the
      # value type has no default, a type with no default to hand back, a
      # reference to a leaked default of a type that has none, the named
      # error value where the Result is the formatter's rather than the
      # crate's, and an arithmetic swap the compiler refuses on a constant.
      # A kill is a test failing, a panic included.
      #
      # The one survivor is the Drop impl that returns the backend handle to
      # the kernel.  Removing it frees nothing, which no test observes without
      # a leak checker, and the lane runs on the stable toolchain, whose
      # sanitizers are nightly-only.  It is recorded rather than justified in
      # the source; a nightly leak leg would kill it and retire the row.  A
      # string the kernel returns is copied and released in one function,
      # with no Drop of its own to remove.
      survivors: 1
      generated: 374
      unviable: 61
      timeouts: 0
      total_mutants: 313
      score_pct: 99.7
      run_at: "2026-10-04"
      # A mutant cargo-mutants ended at its timeout is neither killed nor
      # alive, and no verdict comes from a clock.  None can hang a run by
      # construction: the lane's four files hold no loop, wait or thread, the
      # Rust tests read no clock and start no thread of their own, and
      # cargo-mutants replaces a body or an operator, which cannot turn
      # loop-free code into a loop that never ends.  Its cap is a backstop, and
      # the lane refuses a sweep in which it fired.
      timeout_ceiling: 0
      survivors_ledger:
        - mutator: replace <impl Drop for FfiBackend>::drop with ()
          file: rust/src/backend.rs
          text: if let Ok(syms) = symbols() {
          count: 1
