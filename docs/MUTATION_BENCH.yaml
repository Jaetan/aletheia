# The mutation lane, per binding: which tool, what it is pointed at, and what a
# run of it produced.
#
# AGENTS.md cat 14(g) names the tool and the hot-path modules for each binding.
# This file carries the paths those modules are actually at, which differ where
# a module has been split or renamed: the Python client is under a package of
# its own after its protocols were split out, and its DBC loader is now a
# converter and a YAML loader.
#
# tools/check_mutation_setup.py reads the hot-path lists and refuses a path that
# names nothing. tools/mutation_run.py runs each binding's tool, archives the
# report under benchmarks/mutation/ by commit, and compares the survivors it
# counts with the baseline recorded here: more survivors than the baseline fails
# the lane. A survivor is a test gap, unless the baseline's own comment says why
# that one cannot be killed.
#
# A baseline is a measurement of a tool and a toolchain, not a target. Changing
# either re-measures the row, which is why each tool is pinned exactly.

bindings:

  python:
    tool: mutmut
    version: "==3.8.0"
    install: |
      python/.venv/bin/pip install -e 'python/.[mutation]'
    hot_path:
      # The cat 14(g) Python list, at the paths those modules are at.
      - python/aletheia/client/_client.py
      - python/aletheia/dbc/_converter.py
      - python/aletheia/yaml_loader.py
      - python/aletheia/codes/_issue.py
      - python/aletheia/types.py
    config:
      # mutmut reads `[tool.mutmut]` from the pyproject.toml of the directory
      # it runs in, so the settings are in python/pyproject.toml: `source_paths`,
      # `pytest_add_cli_args_test_selection` and their neighbours. The older
      # `paths_to_mutate` and `tests_dir` are deprecated and warn.
      pyproject_section: "tool.mutmut"
    invocation: |
      cd python && ALETHEIA_LIB=$PWD/../build/libaletheia-ffi.so .venv/bin/mutmut run
    report: |
      cd python && ALETHEIA_LIB=$PWD/../build/libaletheia-ffi.so .venv/bin/mutmut results
    baseline:
      # One survivor, and it is a genuine equivalent: dump_json's
      # ensure_ascii=False becomes None, which json.dumps treats identically,
      # None being falsy. It is documented here rather than excluded at the
      # source, because mutmut attributes a mutation of any argument of a
      # multi-line call to the line the call opens, so a pragma there would
      # also exclude the killable mutants of the value, cls and indent
      # arguments. The gate fails on a second survivor.
      #
      # Everything else a mutation of these modules produces is killed by a
      # test that asserts behaviour. Two kinds are excluded at the source
      # instead, with a pragma: a type argument of a cast, which no runtime
      # reads, and the case of a codec name, which the standard library
      # normalises.
      survivors: 1
      total_mutants: 924
      score_pct: 99
      run_at: "2026-09-16"

  go:
    # AGENTS.md cat 14(g) names gomut, go-mutesting and mutate. This lane uses
    # gremlins instead: go-mutesting panics on the type internals of a current
    # Go, and the fork of it does not resolve a package of several files.
    # gremlins carries the same mutation operators and runs on a current Go,
    # which is what cat 14(g) asks the lane to do.
    tool: gremlins
    install: |
      go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
    hot_path:
      # The cat 14(g) Go list, at the paths those modules are at: the protocol
      # marshalling is json.go and the per-frame enrichment is enrich.go.
      - go/aletheia/client.go
      - go/aletheia/dbc.go
      - go/aletheia/json.go
      - go/aletheia/ffi.go
      - go/aletheia/ffi_nocgo.go
      - go/aletheia/enrich.go
    config: {}
    invocation: |
      cd go && gremlins unleash ./aletheia
    report: |
      # gremlins writes its summary to stdout, counting the mutants it killed,
      # those that lived, those on a line no test reaches, and those that timed
      # out. The runner reads the killed and lived counts from it, and a mutant
      # on an uncovered line is neither: the total below is killed plus lived.
    baseline:
      # Zero survivors is the floor: any survivor on a future commit fails the
      # lane, matching the C++ binding below.
      #
      # gremlins puts every mutant it generates in exactly one bucket, so the
      # counts below add up: generated is the whole set, a property of the
      # source; not_covered is the part on a line no test reaches, a coverage
      # gap rather than a survivor; total_mutants is killed plus lived, which
      # is what the runner records and what score_pct is taken from.
      #
      # The split between killed and timed out moves with the machine, and it
      # moves a long way. This tree gave 649 killed and 11 timed out on a quiet
      # host with nothing editing it, and an earlier one 39 killed with 622
      # timed out in a sweep that had a second sweep running beside it. A sweep
      # whose sources are edited while it runs reports neither: it gathers
      # coverage once at the start and then mutates positions that have moved,
      # so lines a test covers come back as not covered. A mutant that times out counts as neither
      # killed nor lived, so that second run reported no survivors and full
      # efficacy having actually tested one mutant in twenty. A third sweep
      # generated the same total and left none alive, which is what is compared
      # below.
      #
      # So the two numbers to compare a later run against are survivors and
      # generated, which were the same in all three; the rest is what the run
      # recorded here produced.
      survivors: 0
      generated: 762
      not_covered: 102
      timeouts: 11
      total_mutants: 649
      score_pct: 100
      run_at: "2026-09-17"
      # The lane refuses a sweep with more than this many timed out, because a
      # mutant that times out is neither killed nor lived and a sweep that
      # timed out on nearly all of them reports no survivors and full efficacy.
      # A quiet host gives 11, all in the file carrying the cgo trampolines,
      # whose mutants each reload the library; a sweep with a second sweep
      # beside it gave 622. This sits far enough above the first not to flake
      # and far enough below the second to fail hard.
      timeout_ceiling: 50

  cpp:
    tool: mull
    version: "0.34.0 LLVM-22"
    install: |
      # No prebuilt Mull deb ships for LLVM 22 (release debs stop at LLVM-15),
      # and only the latest stable Clang is supported: testing clang-19
      # mutants while shipping clang-22 is a real gap, not cosmetic, since UB
      # can change between compiler versions.  So Mull is built FROM SOURCE
      # against the system LLVM-22, cached in CI.  Grounded recipe:
      #   sudo apt install clang-22 llvm-22-dev      # system LLVM-22
      #   git clone --branch 0.34.0 https://github.com/mull-project/mull /tmp/mull
      #   cd /tmp/mull
      #   # Mull's MODULE.bazel OS map caps ubuntu:24.04 at LLVM-20, so add "22":
      #   sed -i 's/\("ubuntu:24.04": \[\)/\1"22", /' MODULE.bazel
      #   bazel build //rust/mull-tools:mull-runner-22 \
      #               //rust/mull-tools:mull-reporter-22 //:mull-ir-frontend-22
      #   # bazelisk reads .bazelversion (8.6.0); system LLVM via
      #   # new_local_repository(/usr/lib/llvm-22), so no LLVM is downloaded.
      #   cp bazel-bin/.../mull-{runner,reporter}-22 ~/.local/bin/
      #   cp bazel-bin/mull-ir-frontend-22           ~/.local/bin/
      # mull-runner / mull-reporter are Rust binaries; ir-frontend is a C++
      # clang plugin .so.  Full recipe + cache keys: pr-heavy-lanes.yml mutation
      # lane and docs/operations/MUTATION.md § C++.
    hot_path:
      # AGENTS.md cat 14(g) C++ list, less `mock_backend.cpp` and `types.cpp`
      # (test-only and type definitions).  This list is what the static gate
      # requires to exist; it does not select what Mull mutates.  The IR
      # plugin is attached to the library and the test binary, so Mull
      # mutates whatever those compile, which reaches files not listed here
      # and produces nothing for listed files whose operators it does not
      # recognise.
      - cpp/src/backend.cpp
      - cpp/src/client.cpp
      - cpp/src/dbc.cpp
      - cpp/src/enrich.cpp
      - cpp/src/excel.cpp
      - cpp/src/ffi_backend.cpp
      - cpp/src/json_parse.cpp
      - cpp/src/json_serialize.cpp
      - cpp/src/yaml.cpp
    config:
      build_dir: cpp/build-mutation
      cmake_flag: ALETHEIA_MUTATION
      compiler: clang-22
      ir_plugin: ~/.local/bin/mull-ir-frontend-22
      runner: mull-runner-22
    invocation: |
      # The ALETHEIA_MUTATION build folds tests/integration_tests.cpp into the
      # unit_tests binary so the real FfiBackend (dlopen glue) is on the
      # mutation surface. Those tests dlopen build/libaletheia-ffi.so, so
      # `cabal run shake -- build` must have produced it first.
      cd cpp && cmake -B build-mutation -DALETHEIA_MUTATION=ON \
        -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22 \
        > /dev/null && \
        cmake --build build-mutation --target unit_tests && \
        mull-runner-22 ./build-mutation/unit_tests
    report: |
      # mull-runner-22 prints a per-mutant table to stdout; runner parses
      # the "Surviving mutants: N" / "Mutation score: P%" summary at the
      # tail.  Killed count derived from survived + score_pct.
    baseline:
      # Zero survivors is the floor: any survivor on a future commit fails the
      # lane, matching the Go binding above.
      #
      # Two decisions hold the floor.  The mutation binary folds in the
      # real-FFI integration tests, because a mock-only binary never executes
      # the dlopen glue and Mull reports its mutants as uncovered.  Four
      # boundary mutants on the payload-size guards sit behind the client's
      # own size pre-check and are reachable only at exactly sixty-four
      # bytes, which the integration suite's boundary case supplies.
      #
      # The surface moves with the compiler, so the count below is a
      # measurement of this toolchain and not a target.
      survivors: 0
      total_mutants: 62
      timeouts: 0
      score_pct: 100
      run_at: "2026-09-15"
