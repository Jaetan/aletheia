# The mutation lane, per binding: which tool, what it is pointed at, and what a
# run of it produced.
#
# AGENTS.md cat 14(g) names the tool and the hot-path modules for each binding.
# This file carries the paths those modules are actually at, which differ where
# a module has been split or renamed: the Python client is under a package of
# its own after its protocols were split out, and its DBC loader is now a
# converter and a YAML loader.
#
# tools/check_mutation_setup.py reads the hot-path lists and refuses a path that
# names nothing. tools/mutation_run.py runs each binding's tool, archives the
# report under benchmarks/mutation/ by commit, and compares the survivors it
# counts with the baseline recorded here: more survivors than the baseline fails
# the lane. A survivor is a test gap, unless the baseline's own comment says why
# that one cannot be killed.
#
# A baseline is a measurement of a tool and a toolchain, not a target. Changing
# either re-measures the row, which is why each tool is pinned exactly.

bindings:

  python:
    tool: mutmut
    version: "==3.8.0"
    install: |
      python/.venv/bin/pip install -e 'python/.[mutation]'
    hot_path:
      # The cat 14(g) Python list, at the paths those modules are at.
      - python/aletheia/client/_client.py
      - python/aletheia/dbc/_converter.py
      - python/aletheia/yaml_loader.py
      - python/aletheia/codes/_issue.py
      - python/aletheia/types.py
    config:
      # mutmut reads `[tool.mutmut]` from the pyproject.toml of the directory
      # it runs in, so the settings are in python/pyproject.toml: `source_paths`,
      # `pytest_add_cli_args_test_selection` and their neighbours. The older
      # `paths_to_mutate` and `tests_dir` are deprecated and warn.
      pyproject_section: "tool.mutmut"
    invocation: |
      cd python && ALETHEIA_LIB=$PWD/../build/libaletheia-ffi.so .venv/bin/mutmut run
    report: |
      cd python && ALETHEIA_LIB=$PWD/../build/libaletheia-ffi.so .venv/bin/mutmut results
    baseline:
      # One survivor, and it is a genuine equivalent: dump_json's
      # ensure_ascii=False becomes None, which json.dumps treats identically,
      # None being falsy. It is documented here rather than excluded at the
      # source, because mutmut attributes a mutation of any argument of a
      # multi-line call to the line the call opens, so a pragma there would
      # also exclude the killable mutants of the value, cls and indent
      # arguments. The gate fails on a second survivor.
      #
      # Everything else a mutation of these modules produces is killed by a
      # test that asserts behaviour. Two kinds are excluded at the source
      # instead, with a pragma: a type argument of a cast, which no runtime
      # reads, and the case of a codec name, which the standard library
      # normalises.
      #
      # What the set is made of, by mutmut's operators over these modules:
      # most of it is an argument dropped from a call, then a string literal
      # rewritten (wrapped, lowered or uppered, up to three mutants per
      # literal), then an assignment's value replaced by None, and the rest
      # a swapped operator, keyword or number. Every literal is one the
      # module wrote, and Python has no undefined behaviour to crash on, so
      # a kill is a test failing, an exception the test did not expect
      # included; mutmut records no reason, so an argument dropped from a
      # call that then raised is not told apart in the record from one a test
      # caught by its result. The string mutants split by what the literal
      # is: a key, a code or an operator name on the wire, which a test that
      # reads the wire kills, or a message meant for a person, which only a
      # test pinning its wording kills.
      survivors: 1
      total_mutants: 921
      score_pct: 99
      run_at: "2026-09-17"

  go:
    # AGENTS.md cat 14(g) names gomut, go-mutesting and mutate. This lane uses
    # gremlins instead: go-mutesting panics on the type internals of a current
    # Go, and the fork of it does not resolve a package of several files.
    # gremlins carries the same mutation operators and runs on a current Go,
    # which is what cat 14(g) asks the lane to do.
    tool: gremlins
    install: |
      go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
    hot_path:
      # The cat 14(g) Go list, at the paths those modules are at: the protocol
      # marshalling is json.go and the per-frame enrichment is enrich.go.
      - go/aletheia/client.go
      - go/aletheia/dbc.go
      - go/aletheia/json.go
      - go/aletheia/ffi.go
      - go/aletheia/ffi_nocgo.go
      - go/aletheia/enrich.go
    config:
      # gremlins reads this from the directory it runs in. It holds the
      # stringer outputs out of the sweep: a mutant in generated code measures
      # the generator, and no test written here can be the one that kills it.
      exclude: go/.gremlins.yaml
    invocation: |
      cd go && gremlins unleash ./aletheia
    report: |
      # gremlins writes its summary to stdout, counting the mutants it killed,
      # those that lived, those on a line no test reaches, and those that timed
      # out. The runner reads the killed and lived counts from it, and a mutant
      # on an uncovered line is neither: the total below is killed plus lived.
    baseline:
      # Zero survivors is the floor: any survivor on a future commit fails the
      # lane, matching the C++ binding below.
      #
      # gremlins puts every mutant it generates in exactly one bucket, so the
      # counts below add up: generated is the whole set, a property of the
      # source; not_covered is the part on a line no test reaches, a coverage
      # gap rather than a survivor; total_mutants is killed plus lived, which
      # is what the runner records and what score_pct is taken from.
      #
      # The split between killed and timed out moves with the machine, and it
      # moves a long way. This tree gave 617 killed and 2 timed out in under
      # two minutes on a quiet host with nothing editing it. Three conditions make a
      # sweep report numbers nobody should record, each measured here:
      #
      # A second sweep running beside it: 39 killed, 622 timed out. A sweep run
      # straight after another: 25 killed, 632 timed out, because gremlins
      # times a run of the suite to derive its per-mutant timeout and a warm
      # `go test` cache answers in milliseconds. Clear it with
      # `go clean -testcache` before a sweep whose counts are recorded. A
      # mutant that times out is neither killed nor lived, so both of those
      # runs report no survivors and full efficacy having tested one mutant in
      # twenty.
      #
      # Sources edited while the sweep runs: coverage is gathered once at the
      # start and the mutants land at positions that have moved, so lines a
      # test covers come back as not covered.
      #
      # The sweep is run with ALETHEIA_LIB naming the built kernel, which is
      # what the lane and the probe over this file both do. Without it the
      # library-finding fallback runs, where with it set the search returns on
      # its first branch, so the same tree reports 98 not covered and 657
      # killed: the seven blocks that differ are all in that one function, and
      # recording those counts would hold the lane to a run it does not make.
      #
      # So the three numbers a later run is compared against are survivors,
      # generated and not_covered, each a property of the source, its tests and
      # the kernel being present; the killed and timeout counts are what the
      # recorded run produced.
      #
      # Every mutant gremlins makes is on code this package wrote, the
      # generated files being held out, and Go has no undefined behaviour to
      # crash on: a kill is a test failing, a panic the test reported
      # included. Two mutators reach one operator at one site, negating it
      # and moving its boundary, and the two are told apart by the same
      # input a test uses to tell the original from either. The eleven
      # mutators are the five gremlins turns on by default and the six
      # go/.gremlins.yaml turns on, which gremlins ships off.
      survivors: 0
      generated: 762
      not_covered: 39
      timeouts: 2
      total_mutants: 721
      score_pct: 100
      run_at: "2026-09-24"
      # The lane refuses a sweep with more than this many timed out, because a
      # mutant that times out is neither killed nor lived and a sweep that
      # timed out on nearly all of them reports no survivors and full efficacy.
      # A quiet host on a cold test cache gives 2, in the file carrying the
      # cgo trampolines, whose mutants each reload the library; a sweep with a
      # second sweep beside it gave 622, and a sweep run straight after another
      # gave 632. This sits far enough above the first not to flake and far
      # enough below the others to fail hard.
      timeout_ceiling: 50

  cpp:
    tool: mull
    version: "0.34.1 LLVM-23"
    install: |
      # No prebuilt Mull deb ships past LLVM 15, and only the latest stable
      # Clang is supported: testing an older compiler's mutants while shipping
      # the supported one is a real gap, not cosmetic, since UB can change
      # between compiler versions.  So Mull is built FROM SOURCE against the
      # system LLVM-23 by tools/build_mull.sh, which carries the patch Mull
      # 0.34.1 needs to see LLVM 23; CI caches the result.  Recipe:
      #   sudo apt install clang-23 llvm-23-dev libclang-23-dev
      #   tools/build_mull.sh                        # into ~/.local/bin
      # mull-runner / mull-reporter are Rust binaries; ir-frontend is a C++
      # clang plugin .so.  Cache keys: pr-heavy-lanes.yml mutation lane; the
      # procedure: docs/operations/MUTATION.md § C++.
    hot_path:
      # AGENTS.md cat 14(g) C++ list, less `mock_backend.cpp` and `types.cpp`
      # (test-only and type definitions).  This list is what the static gate
      # requires to exist; it does not select what Mull mutates.  The IR
      # plugin is attached to the library and the test binary, so Mull
      # mutates whatever those compile and the link keeps, which reaches
      # files not listed here.  A listed file with no mutant is a defect of
      # the lane, not of the file: a probe holds that every file here has one.
      - cpp/src/backend.cpp
      - cpp/src/client.cpp
      - cpp/src/dbc.cpp
      - cpp/src/enrich.cpp
      - cpp/src/excel.cpp
      - cpp/src/ffi_backend.cpp
      - cpp/src/json_parse.cpp
      - cpp/src/json_serialize.cpp
      - cpp/src/yaml.cpp
    config:
      build_dir: cpp/build-mutation
      cmake_flag: ALETHEIA_MUTATION
      compiler: clang-23
      ir_plugin: ~/.local/bin/mull-ir-frontend-23
      runner: mull-runner-23
      # Named to the build and to the runner by ALETHEIA_MULL_CONFIG, which
      # defaults to the tree's own; a sliced lane points it at a generated
      # configuration holding the other slices' files out.  It names the
      # mutator set and the paths held out (the vendored libraries and the
      # system headers).  The mutation build records each unit's command line,
      # which the plugin's junk detector re-parses with, and runs the compiler
      # through ccache with this file and the plugin named as extra files to
      # hash: what an object holds depends on both, and neither is on the
      # command line by content.
      mutators: cpp/mull.yml
    invocation: |
      # The ALETHEIA_MUTATION build folds tests/integration_tests.cpp into the
      # unit_tests binary so the real FfiBackend (dlopen glue) is on the
      # mutation surface. Those tests dlopen build/libaletheia-ffi.so, so
      # `cabal run shake -- build` must have produced it first.
      #
      # Two trees, and a mutant survives only where both let it survive. Under
      # LeakSanitizer a removed destructor leaks what the object owned and the
      # run fails; the plain tree carries the allocation-fault sweeps, which
      # replace the program's allocation functions to reach the cleanup a
      # container runs while its growth throws. A sanitizer runtime defines
      # those same functions, so the two cannot be one binary.
      cd cpp && cmake -B build-mutation -DALETHEIA_MUTATION=ON -DALETHEIA_SANITIZER=leak \
        -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23 > /dev/null &&
        cmake --build build-mutation --target unit_tests &&
        mull-runner-23 ./build-mutation/unit_tests
      cd cpp && cmake -B build-mutation-plain -DALETHEIA_MUTATION=ON \
        -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23 > /dev/null &&
        cmake --build build-mutation-plain --target unit_tests &&
        mull-runner-23 ./build-mutation-plain/unit_tests
    report: |
      # mull-runner-23 prints a per-mutant table to stdout; runner parses
      # the "Surviving mutants: N" / "Mutation score: P%" summary at the
      # tail.  Killed count derived from survived + score_pct.
    baseline:
      # The measured survivor count of the ruled surface is the floor: a
      # survivor above it on a future commit fails the lane, and the count is
      # worked down by the change that kills or justifies a survivor, which
      # lowers it here in the same commit.
      #
      # What holds the surface. The mutation binary folds in the real-FFI
      # integration suite and the two loader suites, because a mock-only
      # binary never executes the dlopen glue and the static link drops a
      # loader object nothing references. The build records each unit's
      # command line, without which Mull's junk detector drops every mutant
      # of a unit it cannot re-parse. The mutator set and the held-out paths
      # (vendored, system, and the test sources) are cpp/mull.yml. Fixtures
      # live under a per-process directory, so parallel mutant runs do not
      # fail each other. The plugin is patched
      # (tools/mull/mull-unique-mutant-ids.patch) to give every mutant an
      # identifier of its own, where Mull named two mutations of one
      # statement, or of two instantiations of one template, by one name and
      # ran only the last it registered.
      #
      # The two trees read the surface with instruments that cannot share a
      # binary. The leak tree reports a destructor removal that leaks what the
      # object owned. The plain tree carries the allocation-fault sweeps
      # (cpp/tests/alloc_fault.cpp), which fail one chosen allocation of a
      # call and read back the count of blocks the program holds, so the
      # cleanup a container runs while its growth throws is entered and
      # anything it drops is seen. A mutant is a survivor only where both
      # lanes let it survive.
      #
      # What the survivors are, each a row of the ledger below, in the three
      # classes the ledger's own comments name: a refusal of an input no call
      # can build, an out-parameter its callee writes, and the state a process
      # holds once, whose guards the fresh-process binaries exercise. Every other guard the widened mutator set reached has a test
      # feeding the input that fires it, or went with the redundancy it
      # guarded: the logger's own gate, one table lookup per loader word, one
      # symbol loop in the renderer, the factories' own refusals.
      # Every call the source writes under the older mutators is killed: the
      # named-call mutators reach a call that can throw, the capacity hints
      # and the ack fast path are held by allocation counts, the loaders'
      # guards by a document missing each key, the event timestamps and bus
      # bits by a kernel stand-in that quotes what it was handed, the
      # loaders' cleanup paths by allocation-fault sweeps that fail only the
      # project's own allocations, and a temporary the code made for nothing
      # is gone with its destructor. The destructors the compiler emits for
      # the temporaries the language mandates are a mutator the swept set
      # leaves out, for the reason cpp/mull.yml gives.
      #
      # A timeout is a kill by another route: the runner counts it against
      # the total, not as a survivor. The cap per mutant is ten minutes, set
      # on the runner's command line (tools/mutation_cpp.py) rather than left
      # at Mull's default of ten times the unmutated run, which moves with
      # the tree: under debug mode the four mutants that let an oversized
      # input through to a parser run 65 to 79 seconds against baselines of
      # 2 and 5, and the default ended them where the tests would have. An
      # oversubscribed machine can still push a slow mutant past the cap
      # where an idle one reads the route it dies by; that is a property of
      # the machine and not of the code, so a sweep with any timeout is a
      # census taken under load: the probe reports it as untestable rather
      # than absorbing it.
      #
      # How the kills were read, from Mull's SQLite report of each tree,
      # merged with a test's assertion taking precedence over any other
      # route. A check is one the standard library runs in the mutation
      # build: both trees compile under libstdc++'s debug mode, so a read
      # past a container's end or an out-of-range subscript ends the run at
      # that step with the check's message, where the shipped build, which
      # runs no such check, reads whatever lies beyond. A fault is a signal.
      # A mutant killed only by a check or a fault is one no test observes
      # by behaviour; every such mutant was activated against a tree built
      # without the checks, and most then fail a test outright, some die by a
      # signal or hang, and the few that survive are the loop bounds a test
      # never observes past the end, each a finding on its own. The lane
      # names each of them in cpp-unobserved.json beside this census,
      # in the shape the ledger below carries, so re-taking it is a copy. Debug mode
      # spells the containers' names differently, so every mutant's
      # identifier moves with it, while the census and the counts per file do
      # not: two reports either side of the change share no identifier, and
      # nothing recorded here is keyed on one. The counts
      # below are exact, and the probe compares them for equality. They can
      # be, because the lane pins the order the tests run in and because a
      # read the language does not define ends at the check rather than
      # wherever what it read leads: Catch2 shuffles its cases by default
      # under a seed that changes every run, and mull runs the binary once
      # per mutant, so an unpinned lane read a different census every sweep;
      # and under the pinned order alone, a skipped lookup guard that read a
      # string past a map's end still moved between the test and the fault
      # route as the length it read decided between a bad_alloc and a
      # signal. With both, two sweeps of each tree compared mutant for mutant
      # moved nothing. What the order moves is the route and not the
      # verdict, because a fault ends the process and the order decides
      # which test reports before it stops, while a mutant that dies at all
      # dies under every order: that the verdict is order-independent is the
      # separate claim, and a probe sweeps several orders to hold it.
      #
      # The surface moves with the compiler, so the counts below are a
      # measurement of this toolchain and not a target.
      survivors: 8
      total_mutants: 1476
      # What each tree carries, which is not one number: the address tree drops
      # the mutators over calls, since a sanitizer inserts its own checks at
      # the source location of the statement they guard and a mutator over calls
      # mutates those rather than the program's own. Each tree is held to its own
      # figure, and the merge judges a mutant only over the trees carrying it.
      mutants_by_tree:
        leak: 1476
        plain: 1476
        address: 337
      # Mutants per file, which is what the sweep's slices are cut on: a CI
      # leg builds one slice of the surface, and a slice is a set of files
      # whose recorded counts add up to about a third of this total. The
      # counts stand for the sweep's cost because the cost of a mutant hardly
      # varies, 5.6 seconds on the plain tree and 3.3 on the leak tree over
      # the recorded run, and the files that depart from that are the ones
      # carrying a handful.
      #
      # They are a measurement and they age in one direction: adding code adds
      # mutants, nothing refuses that, and the slices drift out of balance
      # quietly. So the merge prints what the heaviest slice would carry today
      # under these weights, and the review that re-takes them is scheduled
      # against that number rather than against a date
      # (docs/operations/MUTATION.md, AGENTS.md § Universal Rules). Coverage
      # never depends on them: a file the record does not name still lands in
      # a slice, because the partition is computed over every tracked file of
      # the library and not over this list.
      mutants_by_file:
        cpp/benchmarks/measure.hpp: 7
        cpp/include/aletheia/backend.hpp: 2
        cpp/include/aletheia/check.hpp: 16
        cpp/include/aletheia/client.hpp: 3
        cpp/include/aletheia/detail/cache_keys.hpp: 16
        cpp/include/aletheia/detail/rational_renderer.hpp: 2
        cpp/include/aletheia/log.hpp: 17
        cpp/include/aletheia/ltl.hpp: 2
        cpp/include/aletheia/response.hpp: 9
        cpp/include/aletheia/types.hpp: 41
        cpp/src/backend.cpp: 18
        cpp/src/client.cpp: 356
        cpp/src/dbc.cpp: 49
        cpp/src/detail/ffi_logic.cpp: 18
        cpp/src/detail/loader_utils.cpp: 101
        cpp/src/detail/loader_utils.hpp: 31
        cpp/src/enrich.cpp: 12
        cpp/src/excel.cpp: 185
        cpp/src/ffi_backend.cpp: 105
        cpp/src/json_parse.cpp: 313
        cpp/src/json_serialize.cpp: 48
        cpp/src/rational_renderer.cpp: 35
        cpp/src/yaml.cpp: 90
      timeouts: 0
      score_pct: 99.5
      run_at: "2026-09-24"
      kill_routes:
        test: 1296
        leak: 3
        address: 22
        kernel: 2
        check: 122
        fault: 23
        timeout: 0
        survived: 8
      # Every survivor, by mutator, repository-relative file, the text of its
      # source line and how many mutants share that line. The lane refuses a
      # survivor not named here even at an unchanged count, and reports a row
      # that no longer survives as stale; the change that kills or removes one
      # deletes its row here.
      survivors_ledger:
        # refusal of an input no call can build, 3 mutants:
        # SignalInjection::create refuses arrays of unequal length and a count
        # past the wire's 32 bits; injection() hands it three arrays of one
        # resolution, whose count the message bound keeps under a thousand.
        # The guard stands for a direct caller of the factory, which the tests
        # reach through it; behind injection() nothing can fire it.
        - mutator: cxx_replace_bool_call_true
          file: cpp/src/client.cpp
          text: if (!block)
          count: 1
        - mutator: cxx_replace_bool_call_true
          file: cpp/src/client.cpp
          text: if (!inj)
          count: 2
        # out-parameter the callee writes, 2 mutants: A start value the callee
        # overwrites on success and nothing reads on failure: from_chars
        # writes its result, the kernel its output size. The alternative is an
        # object left indeterminate, which the guidelines refuse.
        - mutator: cxx_init_const
          file: cpp/src/excel.cpp
          text: std::uint32_t result = 0;
          count: 1
        - mutator: cxx_init_const
          file: cpp/src/ffi_backend.cpp
          text: std::uint32_t out_size = 0;
          count: 1
        # state a process holds once, 3 mutants: The runtime initialises once
        # per process and the renderer loads once, so the guard on the first
        # load, the guard on an uninitialised runtime and the environment
        # override read at that load are exercised by the binaries of their
        # own that start a fresh process (rts_params_tests,
        # rts_init_renderer_uninitialized_tests), which the mutation binary
        # cannot fold in.
        - mutator: cxx_replace_bool_call_true
          file: cpp/src/rational_renderer.cpp
          text: if (!loaded) {
          count: 1
        - mutator: cxx_replace_bool_call_true
          file: cpp/src/rational_renderer.cpp
          text: if (!rts_initialized())
          count: 1
        - mutator: cxx_replace_pointer_call_null
          file: cpp/src/ffi_backend.cpp
          text: const char* override_env = std::getenv(std::string{detail::rts_override_env}.c_str());
          count: 1
      # Every kill no test observes by behaviour, by mutator, repository-relative
      # file, the text of its source line, the route it took and what refused
      # it: the invariant of the standard library's check, or the class the
      # address sanitizer names its report by. The count is how many mutants of
      # that mutator share the line. These are the mutations that run straight
      # into an operation the language does not define, a guard for most of
      # them and the value an index is computed from for the rest, with the
      # suite reporting nothing before the process stops: an instrument is what
      # ends them, and on the shipped build, which runs none of them, nothing
      # would.
      #
      # The lane refuses a row this does not name, as it refuses an unrecorded
      # survivor: a new one is a line somebody has to look at, not a number to
      # carry. It reports a row the sweep no longer produces rather than
      # failing on it, because a test that learned to observe a kill is an
      # improvement and the change that made it lowers this record; the probe
      # over this ledger refuses that direction too, so a stale row is not kept
      # quietly.
      #
      # Three things are deliberate against rot. A row is keyed on the text of
      # its line and not the line's number, so an edit above the site does not
      # move it and an edit of the site does. The refusal is recorded down to
      # its invariant, without the index and the size the check printed, since
      # those come from the test data and a fixture fed differently would
      # reword a row with no claim having changed. And the always-on gate
      # (tools/check_mutation_setup.py) reads the recorded file for the
      # recorded text, so a renamed file or a reworded line is caught in
      # seconds rather than at the end of a sweep.
      #
      # The rows survive the standard library the lane is built against
      # changing version, which they have to: this machine compiles them under
      # libstdc++ 16 and the workflow installs 15. Measured over the four
      # shapes the rows carry, a past-the-end dereference, an out-of-range
      # subscript, a span refusing an offset and a valueless expected read:
      # the debug-mode sentences are identical, and the assertions differ only
      # in the header path and line they name, span:450 against span:436 and
      # expected:731 against expected:791, which is not what a row records.
      # What it records, the invariant, is the same string under both, and
      # each of the nine invariants the rows name is present in the headers of
      # both versions.
      unobserved_ledger:
        - mutator: cxx_add_assign_to_sub_assign
          file: cpp/src/client.cpp
          text: off += (std::size_t{nerrs} * k_error_record_bytes) +
          route: check
          refused: __offset <= size()
          count: 1
        - mutator: cxx_add_assign_to_sub_assign
          file: cpp/src/client.cpp
          text: off += std::size_t{nvals} * k_value_record_bytes;
          route: check
          refused: __offset <= size()
          count: 1
        - mutator: cxx_add_to_sub
          file: cpp/src/client.cpp
          text: ((std::size_t{nerrs} + 1) * k_offset_bytes) + std::size_t{reason_bytes};
          route: check
          refused: __offset <= size()
          count: 1
