# The mutation lane, per binding: which tool, what it is pointed at, and what a
# run of it produced.
#
# AGENTS.md cat 14(g) names the tool and the hot-path modules for each binding.
# This file carries the paths those modules are actually at, which differ where
# a module has been split or renamed: the Python client is under a package of
# its own after its protocols were split out, and its DBC loader is now a
# converter and a YAML loader.
#
# tools/check_mutation_setup.py reads the hot-path lists and refuses a path that
# names nothing. tools/mutation_run.py runs each binding's tool, archives the
# report under benchmarks/mutation/ by commit, and compares the survivors it
# counts with the baseline recorded here: more survivors than the baseline fails
# the lane. A survivor is a test gap, unless the baseline's own comment says why
# that one cannot be killed.
#
# A baseline is a measurement of a tool and a toolchain, not a target. Changing
# either re-measures the row, which is why each tool is pinned exactly.

bindings:

  python:
    tool: mutmut
    version: "==3.8.0"
    install: |
      python/.venv/bin/pip install -e 'python/.[mutation]'
    hot_path:
      # The cat 14(g) Python list, at the paths those modules are at.
      - python/aletheia/client/_client.py
      - python/aletheia/dbc/_converter.py
      - python/aletheia/yaml_loader.py
      - python/aletheia/codes/_issue.py
      - python/aletheia/types.py
    config:
      # mutmut reads `[tool.mutmut]` from the pyproject.toml of the directory
      # it runs in, so the settings are in python/pyproject.toml: `source_paths`,
      # `pytest_add_cli_args_test_selection` and their neighbours. The older
      # `paths_to_mutate` and `tests_dir` are deprecated and warn.
      pyproject_section: "tool.mutmut"
    invocation: |
      cd python && ALETHEIA_LIB=$PWD/../build/libaletheia-ffi.so .venv/bin/mutmut run
    report: |
      cd python && ALETHEIA_LIB=$PWD/../build/libaletheia-ffi.so .venv/bin/mutmut results
    baseline:
      # One survivor, and it is a genuine equivalent: dump_json's
      # ensure_ascii=False becomes None, which json.dumps treats identically,
      # None being falsy. It is documented here rather than excluded at the
      # source, because mutmut attributes a mutation of any argument of a
      # multi-line call to the line the call opens, so a pragma there would
      # also exclude the killable mutants of the value, cls and indent
      # arguments. The gate fails on a second survivor.
      #
      # Everything else a mutation of these modules produces is killed by a
      # test that asserts behaviour. Two kinds are excluded at the source
      # instead, with a pragma: a type argument of a cast, which no runtime
      # reads, and the case of a codec name, which the standard library
      # normalises.
      survivors: 1
      total_mutants: 921
      score_pct: 99
      run_at: "2026-09-17"

  go:
    # AGENTS.md cat 14(g) names gomut, go-mutesting and mutate. This lane uses
    # gremlins instead: go-mutesting panics on the type internals of a current
    # Go, and the fork of it does not resolve a package of several files.
    # gremlins carries the same mutation operators and runs on a current Go,
    # which is what cat 14(g) asks the lane to do.
    tool: gremlins
    install: |
      go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
    hot_path:
      # The cat 14(g) Go list, at the paths those modules are at: the protocol
      # marshalling is json.go and the per-frame enrichment is enrich.go.
      - go/aletheia/client.go
      - go/aletheia/dbc.go
      - go/aletheia/json.go
      - go/aletheia/ffi.go
      - go/aletheia/ffi_nocgo.go
      - go/aletheia/enrich.go
    config: {}
    invocation: |
      cd go && gremlins unleash ./aletheia
    report: |
      # gremlins writes its summary to stdout, counting the mutants it killed,
      # those that lived, those on a line no test reaches, and those that timed
      # out. The runner reads the killed and lived counts from it, and a mutant
      # on an uncovered line is neither: the total below is killed plus lived.
    baseline:
      # Zero survivors is the floor: any survivor on a future commit fails the
      # lane, matching the C++ binding below.
      #
      # gremlins puts every mutant it generates in exactly one bucket, so the
      # counts below add up: generated is the whole set, a property of the
      # source; not_covered is the part on a line no test reaches, a coverage
      # gap rather than a survivor; total_mutants is killed plus lived, which
      # is what the runner records and what score_pct is taken from.
      #
      # The split between killed and timed out moves with the machine, and it
      # moves a long way. This tree gave 646 killed and 11 timed out in under
      # two minutes on a quiet host with nothing editing it. Three conditions make a
      # sweep report numbers nobody should record, each measured here:
      #
      # A second sweep running beside it: 39 killed, 622 timed out. A sweep run
      # straight after another: 25 killed, 632 timed out, because gremlins
      # times a run of the suite to derive its per-mutant timeout and a warm
      # `go test` cache answers in milliseconds. Clear it with
      # `go clean -testcache` before a sweep whose counts are recorded. A
      # mutant that times out is neither killed nor lived, so both of those
      # runs report no survivors and full efficacy having tested one mutant in
      # twenty.
      #
      # Sources edited while the sweep runs: coverage is gathered once at the
      # start and the mutants land at positions that have moved, so lines a
      # test covers come back as not covered.
      #
      # The sweep is run with ALETHEIA_LIB naming the built kernel, which is
      # what the lane and the probe over this file both do. Without it the
      # library-finding fallback runs, where with it set the search returns on
      # its first branch, so the same tree reports 98 not covered and 657
      # killed: the seven blocks that differ are all in that one function, and
      # recording those counts would hold the lane to a run it does not make.
      #
      # So the three numbers a later run is compared against are survivors,
      # generated and not_covered, each a property of the source, its tests and
      # the kernel being present; the killed and timeout counts are what the
      # recorded run produced.
      survivors: 0
      generated: 759
      not_covered: 102
      timeouts: 11
      total_mutants: 646
      score_pct: 100
      run_at: "2026-09-17"
      # The lane refuses a sweep with more than this many timed out, because a
      # mutant that times out is neither killed nor lived and a sweep that
      # timed out on nearly all of them reports no survivors and full efficacy.
      # A quiet host on a cold test cache gives 11, in the file carrying the
      # cgo trampolines, whose mutants each reload the library; a sweep with a
      # second sweep beside it gave 622, and a sweep run straight after another
      # gave 632. This sits far enough above the first not to flake and far
      # enough below the others to fail hard.
      timeout_ceiling: 50

  cpp:
    tool: mull
    version: "0.34.1 LLVM-23"
    install: |
      # No prebuilt Mull deb ships past LLVM 15, and only the latest stable
      # Clang is supported: testing an older compiler's mutants while shipping
      # the supported one is a real gap, not cosmetic, since UB can change
      # between compiler versions.  So Mull is built FROM SOURCE against the
      # system LLVM-23 by tools/build_mull.sh, which carries the patch Mull
      # 0.34.1 needs to see LLVM 23; CI caches the result.  Recipe:
      #   sudo apt install clang-23 llvm-23-dev libclang-23-dev
      #   tools/build_mull.sh                        # into ~/.local/bin
      # mull-runner / mull-reporter are Rust binaries; ir-frontend is a C++
      # clang plugin .so.  Cache keys: pr-heavy-lanes.yml mutation lane; the
      # procedure: docs/operations/MUTATION.md § C++.
    hot_path:
      # AGENTS.md cat 14(g) C++ list, less `mock_backend.cpp` and `types.cpp`
      # (test-only and type definitions).  This list is what the static gate
      # requires to exist; it does not select what Mull mutates.  The IR
      # plugin is attached to the library and the test binary, so Mull
      # mutates whatever those compile and the link keeps, which reaches
      # files not listed here.  A listed file with no mutant is a defect of
      # the lane, not of the file: a probe holds that every file here has one.
      - cpp/src/backend.cpp
      - cpp/src/client.cpp
      - cpp/src/dbc.cpp
      - cpp/src/enrich.cpp
      - cpp/src/excel.cpp
      - cpp/src/ffi_backend.cpp
      - cpp/src/json_parse.cpp
      - cpp/src/json_serialize.cpp
      - cpp/src/yaml.cpp
    config:
      build_dir: cpp/build-mutation
      cmake_flag: ALETHEIA_MUTATION
      compiler: clang-23
      ir_plugin: ~/.local/bin/mull-ir-frontend-23
      runner: mull-runner-23
      # Read by the plugin and the runner from their working directory upward.
      # It names the mutator set and the paths held out (the vendored
      # libraries and the system headers).  The mutation build records each
      # unit's command line, which the plugin's junk detector re-parses with,
      # and takes no ccache launcher, because ccache hashes neither this file
      # nor the plugin.
      mutators: cpp/mull.yml
    invocation: |
      # The ALETHEIA_MUTATION build folds tests/integration_tests.cpp into the
      # unit_tests binary so the real FfiBackend (dlopen glue) is on the
      # mutation surface. Those tests dlopen build/libaletheia-ffi.so, so
      # `cabal run shake -- build` must have produced it first.
      #
      # Two trees, and a mutant survives only where both let it survive. Under
      # LeakSanitizer a removed destructor leaks what the object owned and the
      # run fails; the plain tree carries the allocation-fault sweeps, which
      # replace the program's allocation functions to reach the cleanup a
      # container runs while its growth throws. A sanitizer runtime defines
      # those same functions, so the two cannot be one binary.
      cd cpp && cmake -B build-mutation -DALETHEIA_MUTATION=ON -DALETHEIA_SANITIZER=leak \
        -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23 > /dev/null &&
        cmake --build build-mutation --target unit_tests &&
        mull-runner-23 ./build-mutation/unit_tests
      cd cpp && cmake -B build-mutation-plain -DALETHEIA_MUTATION=ON \
        -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23 > /dev/null &&
        cmake --build build-mutation-plain --target unit_tests &&
        mull-runner-23 ./build-mutation-plain/unit_tests
    report: |
      # mull-runner-23 prints a per-mutant table to stdout; runner parses
      # the "Surviving mutants: N" / "Mutation score: P%" summary at the
      # tail.  Killed count derived from survived + score_pct.
    baseline:
      # The measured survivor count of the ruled surface is the floor: a
      # survivor above it on a future commit fails the lane, and the count is
      # worked down by the change that kills or justifies a survivor, which
      # lowers it here in the same commit.
      #
      # What holds the surface. The mutation binary folds in the real-FFI
      # integration suite and the two loader suites, because a mock-only
      # binary never executes the dlopen glue and the static link drops a
      # loader object nothing references. The build records each unit's
      # command line, without which Mull's junk detector drops every mutant
      # of a unit it cannot re-parse. The mutator set and the held-out paths
      # (vendored, system, and the test sources) are cpp/mull.yml. Fixtures
      # live under a per-process directory, so parallel mutant runs do not
      # fail each other. The plugin is patched
      # (tools/mull/mull-unique-mutant-ids.patch) to give every mutant an
      # identifier of its own, where Mull named two mutations of one
      # statement, or of two instantiations of one template, by one name and
      # ran only the last it registered.
      #
      # The two trees read the surface with instruments that cannot share a
      # binary. The leak tree reports a destructor removal that leaks what the
      # object owned. The plain tree carries the allocation-fault sweeps
      # (cpp/tests/alloc_fault.cpp), which fail one chosen allocation of a
      # call and read back the count of blocks the program holds, so the
      # cleanup a container runs while its growth throws is entered and
      # anything it drops is seen. A mutant is a survivor only where both
      # lanes let it survive.
      #
      # What the survivors are, each a row of the ledger below. Most are
      # removals of a destructor that frees nothing, which both instruments
      # agree on: the temporary a push_back has already moved from, a string
      # short enough to live in the object rather than on the heap, and the
      # spreadsheet library's handles, which own nothing themselves. The
      # spreadsheet loader has no sweep of its own yet, so its rows carry
      # cleanup that has not been reached as well as cleanup that frees
      # nothing. The rest: the two wire fields the kernel acknowledges without
      # reading, the CAN-FD bus bits and the timestamp of an error or remote
      # event, held until a consumer of them lands; the ack fast path of the
      # frame parser, which the throughput harness measures; and the
      # renderer's library search, which runs once per process after the first
      # backend has registered its path and is held by a probe in a process of
      # its own.
      #
      # A timeout is a kill by another route: the runner counts it against
      # the total, not as a survivor. Its exact count is not stable for a
      # mutant whose behaviour is undefined (a signal count replaced by a
      # constant reads past the arrays, and crashes on one run and hangs on
      # the next), so the probe holds it within a stated margin of the count
      # recorded here.
      #
      # The surface moves with the compiler, so the counts below are a
      # measurement of this toolchain and not a target.
      survivors: 74
      total_mutants: 1047
      timeouts: 0
      score_pct: 93
      run_at: "2026-09-18"
      # Every survivor, by mutator, repository-relative file, the text of its
      # source line and how many mutants share that line. The lane refuses a
      # survivor not named here even at an unchanged count, and reports a row
      # that no longer survives as stale; the change that kills or removes one
      # deletes its row here.
      survivors_ledger:
        - mutator: cxx_remove_implicit_destructor
