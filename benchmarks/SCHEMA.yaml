#
# Canonical cross-binding benchmark schema — the single source of truth for the
# "same measurement, same name, every API language" rule.
#
# All four benchmark harnesses (Python python/benchmarks/, C++ cpp/benchmarks/,
# Go go/benchmarks/, Rust rust/examples/benchmark/) MUST emit JSON that
# matches this schema for each mode: identical CLI flag set, identical `results`
# container, identical per-row key sets, and byte-identical human label strings
# in the same order. tools/check_bench_schema.py enforces this against every
# binding on every CI run (structure + labels + types + per-sweep row counts +
# the parameters it ran with — never the measured values, which are
# host-dependent).
#
# This file is authority. To change a lane name, a row key, or a sweep, edit
# HERE first, then update all four harnesses; the gate fails until they agree.

envelope:
  # Every mode, every binding wraps its payload in this object.
  top_keys: [benchmark, language, timestamp, system, parameters, results]
  languages: [python, cpp, go, rust]
  benchmarks: [throughput, latency, scaling]
  # `system` names the machine and the toolchain that measured the report:
  # every binding its runtime's version, and C++ its compiler and build type.
  system_keys:
    python: [cpu, cores, platform, python]
    cpp: [cpu, cores, platform, build_type, compiler]
    go: [cpu, cores, platform, go]
    rust: [cpu, cores, platform, rust]
  # `parameters` records every flag of the mode's `flags` but --json, under the
  # flag's name without its dashes, at the value the run read: a count, or
  # true or false for a switch. `warmup` counts untimed passes in throughput
  # and untimed operations in latency.

modes:

  throughput:
    flags: ["--frames", "--runs", "--warmup", "--json"]
    results_container: list
    # One object per lane, keys in any order but this exact set.
    row_keys: [name, frames, runs, fps_mean, fps_stdev, fps_min, fps_max, us_per_frame]
    # The six lanes, verbatim and in this order. The CAN-FD prefix carries a
    # colon + THREE spaces for column alignment; CAN 2.0B a colon + ONE space.
    lane_names:
      - "CAN 2.0B: Stream LTL (2 props)"
      - "CAN 2.0B: Signal Extraction"
      - "CAN 2.0B: Frame Building"
      - "CAN-FD:   Stream LTL (3 props)"
      - "CAN-FD:   Signal Extraction"
      - "CAN-FD:   Frame Building"

  latency:
    flags: ["--ops", "--warmup", "--json"]
    results_container: list
    row_keys: [name, count, mean_us, min_us, max_us, p50_us, p90_us, p99_us, p999_us]
    # Distinct spelling from throughput (no colon, "Streaming LTL" not
    # "Stream LTL (N props)") — but IDENTICAL across all four bindings, which is
    # what the cross-language rule requires. Cross-MODE naming is intentionally
    # separate.
    lane_names:
      - "CAN 2.0B Streaming LTL"
      - "CAN 2.0B Signal Extraction"
      - "CAN 2.0B Frame Building"
      - "CAN-FD Streaming LTL"
      - "CAN-FD Signal Extraction"
      - "CAN-FD Frame Building"

  scaling:
    flags: ["--runs", "--quick", "--json"]
    # A DICT keyed by sub-benchmark (NOT a flat list): scaling runs distinct
    # sweeps, each its own row schema, emitted in the order listed here.
    results_container: dict
    sub_benchmarks: [trace_size_can20, trace_size_canfd, property_count, property_complexity, dbc_size, text_literal_length, json_literal_length]
    # Per-sub-benchmark row key sets.
    row_keys:
      trace_size_can20: [frames, fps, relative]
      trace_size_canfd: [frames, fps, relative]
      property_count: [properties, fps, us_per_frame, relative]
      property_complexity: [complexity, fps, us_per_frame, relative]
      dbc_size: [messages, seconds, allocated_bytes, messages_per_sec, relative]
      text_literal_length: [digits, seconds, allocated_bytes, digits_per_sec, relative]
      json_literal_length: [digits, seconds, allocated_bytes, digits_per_sec, relative]
    # Row COUNT per sweep under --quick (the mode the gate runs): deterministic,
    # so the gate can assert it without touching measured values.  The dbc_size
    # sizes and the literal sizes each double the last, as the load scaling
    # check needs.
    quick_row_counts:
      trace_size_can20: 4        # [1000, 5000, 10000, 50000] (full drops in 100000)
      trace_size_canfd: 4
      property_count: 6          # [1, 2, 3, 5, 7, 10]
      property_complexity: 5
      dbc_size: 3                # [2500, 5000, 10000]
      text_literal_length: 3     # [25000, 50000, 100000]
      json_literal_length: 3     # [25000, 50000, 100000]
    # The five complexity labels, verbatim and in order (the "complexity" row field).
    complexity_labels:
      - "Simple predicate"
      - "Range predicate"
      - "Two predicates (AND)"
      - "Three predicates"
      - "Implication"

# ── Canonical experiment definitions (for the harness authors; the gate checks
#    structure/labels/counts, not these magnitudes) ───────────────────────────
experiment:
  # Averaging: every streaming point is the mean of --runs passes (default 5);
  # single-pass is NOT used.  A point of a load sweep (dbc_size or a literal
  # sweep) keeps the MINIMUM seconds and, apart, the MINIMUM allocated_bytes of
  # its --runs loads: the sweeps compare sizes' costs, and the minimum is the
  # least noisy estimate of the work.
  scaling_runs_default: 5
  # Frames per timed pass. For trace-size sweeps the size IS the frame count;
  # for property-count / property-complexity it is fixed:
  frames_per_point:
    full: 10000
    quick: 5000
  trace_sizes:
    full: [1000, 5000, 10000, 50000, 100000]
    quick: [1000, 5000, 10000, 50000]
  property_counts: [1, 2, 3, 5, 7, 10]
  # dbc_size: messages per DBC, each load on a fresh client after one untimed
  # 500-message warm-up load.  Of n messages, message i: name M{i}, extended
  # CAN ID 0x100000 + i, DLC 8, sender N{i}, additional sender
  # N{(i + 1) mod n}, one signal S{i} (start bit 0, 8 bits, little-endian,
  # unsigned, factor 1, offset 0, range [0, 255], unit "", receiver N{i}), and
  # one comment "c" targeting it by its CAN ID; nodes N0 to N{n - 1}; version
  # "1.0".  Every kind of reference doubles with the messages.
  dbc_sizes:
    full: [1250, 2500, 5000, 10000]
    quick: [2500, 5000, 10000]
  # The literal sweeps, text_literal_length and json_literal_length, run at
  # literal_lengths: a point's digits, D, are the zeros after "1." in the factor
  # of the DBC's one signal, where <D zeros> stands for them.  Each sweep runs
  # one untimed warm-up load at 1000 digits first.  The kernel reduces the
  # factor to 1, so a load succeeds; a refused load ends the program non-zero,
  # naming the refusal, and is never recorded.
  literal_lengths:
    full: [12500, 25000, 50000, 100000]
    quick: [25000, 50000, 100000]
  # text_literal_length loads text_literal_length_text, its "\n" line ends, its
  # SG_ line opening on one space and its final "\n" included, on a fresh
  # client per load, through the binding's DBC text load (parse_dbc_text).
  text_literal_length_text: |
    VERSION ""

    NS_ :

    BS_:

    BU_: ECU

    BO_ 200 Msg: 8 ECU
     SG_ Sel : 0|8@1+ (1.<D zeros>,0) [0|255] "" ECU
  # json_literal_length sends json_literal_length_command, one line with no
  # line end, in a fresh session per load, through the binding's public raw
  # command path (process); any answer but "status": "success" is a refusal.
  json_literal_length_command: '{"type":"command","command":"parseDBC","dbc":{"version":"","messages":[{"id":200,"name":"Msg","dlc":8,"sender":"ECU","senders":[],"extended":false,"signals":[{"name":"Sel","startBit":0,"length":8,"byteOrder":"little_endian","signed":false,"factor":1.<D zeros>,"offset":0,"minimum":0,"maximum":255,"unit":"","presence":"always","receivers":["ECU"],"valueDescriptions":[]}]}],"signalGroups":[],"environmentVars":[],"valueTables":[],"nodes":[{"name":"ECU"}],"comments":[],"attributes":[],"unresolvedValueDescs":[]}}'
  # allocated_bytes: the bytes one load allocated, the kernel's process-wide
  # count (aletheia_allocated_bytes) read on the open client or session just
  # before the clock starts, subtracted from the count read just after it
  # stops, so neither read is timed.  A whole number, written as a JSON integer.
  # seconds is the load's wall time; messages_per_sec = messages / seconds and
  # digits_per_sec = digits / seconds.
  # relative = fps / (fps of the first row in the same sweep); for dbc_size,
  # messages_per_sec / (the first row's messages_per_sec); for a literal sweep,
  # digits_per_sec / (the first row's digits_per_sec).
  relative_baseline: first_row
  # Rounding (match across bindings): fps -> 1 dp, us_per_frame -> 1 dp,
  # relative -> 3 dp, seconds -> 4 dp, messages_per_sec -> 1 dp,
  # digits_per_sec -> 1 dp.
  rounding: { fps: 1, us_per_frame: 1, relative: 3, seconds: 4, messages_per_sec: 1, digits_per_sec: 1 }
  # trace-size sweep properties (one Always-wrapped range predicate each):
  trace_size_property:
    can20: "Always(Atomic(Between(EngineSpeed, 0, 8000)))"
    canfd: "Always(Atomic(Between(GPSSpeed, 0, 655)))"
  # property-count sweep: 10 templates cycled by (i mod 10); count in property_counts.
  # property-complexity: the five labelled bundles below (CAN 2.0B).
  complexity_bundles:
    - label: "Simple predicate"
      formula: "Always(Atomic(LessThan(EngineSpeed, 8000)))"
    - label: "Range predicate"
      formula: "Always(Atomic(Between(EngineSpeed, 0, 8000)))"
    - label: "Two predicates (AND)"
      formula: "[Always(Between(EngineSpeed,0,8000)), Always(Between(EngineTemp,-40,215))]"
    - label: "Three predicates"
      formula: "[Always(Between(EngineSpeed,0,8000)), Always(Between(EngineTemp,-40,215)), Always(LessThan(BrakePressure, 13107/2))]"
    - label: "Implication"
      # implies is NOT a primitive: it lowers to Or(Not(antecedent), consequent).
      formula: "Always(Or(Not(Atomic(LessThan(EngineSpeed,1000))), Atomic(LessThan(EngineTemp,100))))"
