#
# The licence texts of the third-party code the release bundle carries in
# lib/: the Agda runtime support and Agda libraries compiled into the
# kernel library, and the libraries beside it.  One folder
# <name>-<version> per work holds the licence it declares and that of each
# separately licensed work compiled into it, each text taken from the
# source tarball of the GHC the bundle is built with or from the upstream
# source its `source:` names; base's NOTICE says which of base's code its
# source credits to HBC and to nhc, rts's NOTICE which of its code it
# credits to HBC.  That GHC's install holds only its own
# licence, a copy in each package's documentation directory, which is the
# runtime system's and ghc-boot-th's text and no other library's.  The
# dist rule copies each library's folders into the bundle's licenses/.
# `cabal run shake -- check-bundle-licences` holds this record to the
# folders, to their texts and to the GHC on the search path, so a GHC,
# Agda or Agda library bump fails it until the texts are taken again.
# The works compiled into a library are found by tools/licence_audit.py,
# whose verdicts audit.yaml beside this file holds.
# GitHub generates the agda-stdlib archive on request, so a later download
# of the same tag can hash otherwise; the texts' own hashes are what the
# check holds.
